# Catalog settings for pnpm.
# https://pnpm.io/catalogs#catalogmode
catalogMode: prefer

# Automatically prune the catalog to remove unused entries.
# https://pnpm.io/catalogs#catalogprune
catalogPrune: true

# Enforces strict engine compatibility for all packages.
# https://pnpm.io/settings/cli#enginestrict
engineStrict: true

# Lockfile settings
# https://pnpm.io/settings/store#lockfile-settings
lockfile:
  includeResolutionSettings: true

# Delays installation of newly published packages by 3 days (4320 minutes),
# giving time for the community and security tools to detect compromised releases.
# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 4320

# Overrides allows you to instruct pnpm to override any dependency in the dependency graph,
# including peer dependencies.
# https://pnpm.io/settings/dependency-resolution#overrides
# overrides:

# Patches specific dependencies to apply custom fixes or modifications.
# https://pnpm.io/settings#patcheddependencies
# Fails installation if a package's trust level has decreased compared to previous releases
# (e.g. a previously verified publisher is replaced by an unverified one).
# https://pnpm.io/settings#trustpolicy
trustPolicy: no-downgrade

# Exclude specific packages from the trust policy checks, allowing them to be installed
# even if their trust level has decreased.
# https://pnpm.io/settings#trustpolicyexclude
trustPolicyExclude:
  # semver@6.3.1 is a v6 backport published (2023/7/10) after 7.5.1+ which had provenance.
  # pnpm evaluates trust by publish date (not semver), so this triggers a false downgrade.
  # The semver maintainer states this is not a security concern.
  # See: https://github.com/npm/node-semver/issues/838
  - 'semver@6.3.1'

# Sets the prefix used when saving dependencies with pnpm install.
# "=" ensures exact versions are saved.
# https://pnpm.io/settings/other#saveprefix
savePrefix: '='
