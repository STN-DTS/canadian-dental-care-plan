# Local-only observability stack for testing the host frontend's OTLP logs,
# metrics, and traces. The frontend sends all signals to Alloy, which routes
# logs to Loki, metrics to Prometheus, and traces to Tempo. Grafana provides UI.
# This file starts observability services; it does not start the frontend.
# Version/digest pins replace floating tags with releases published at least three days before selection.
services:
  loki:
    # Stores OTLP logs forwarded by Alloy.
    image: docker.io/grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: canadian-dental-care-plan-loki
    command:
      - -config.file=/etc/loki/config.yaml
    ports:
      - '3100:3100'
    volumes:
      - ./.otel-local/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  prometheus:
    # Stores metrics forwarded by Alloy using Prometheus remote write.
    image: docker.io/prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: canadian-dental-care-plan-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - '9090:9090'
    volumes:
      - ./.otel-local/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  tempo:
    # Stores traces forwarded by Alloy over OTLP/HTTP.
    # Back up existing 2.x data before upgrading: Tempo 3.x has no supported downgrade path.
    image: docker.io/grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    container_name: canadian-dental-care-plan-tempo
    command:
      - -config.file=/etc/tempo/tempo.yaml
    ports:
      - '3200:3200'
    volumes:
      - ./.otel-local/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  alloy:
    # Receives all OTLP/HTTP signals from the host frontend on port 4318.
    image: docker.io/grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    container_name: canadian-dental-care-plan-alloy
    command:
      - run
      - --stability.level=experimental
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    ports:
      - '4318:4318'
      - '12345:12345'
    volumes:
      - ./.otel-local/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      - loki
      - prometheus
      - tempo

  grafana:
    # Provides the local UI for exploring logs, metrics, and traces.
    image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: canadian-dental-care-plan-grafana
    environment:
      GF_FEATURE_TOGGLES_ENABLE: grafanaAdvisor
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '3001:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./.otel-local/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - loki
      - prometheus
      - tempo

volumes:
  # Named volumes retain service state when `podman compose down` removes
  # containers and network. Use `down -v` only to delete local telemetry data.
  alloy-data:
  grafana-data:
  loki-data:
  prometheus-data:
  tempo-data:
