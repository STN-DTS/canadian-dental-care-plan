# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Authenticates to Azure and ACR with Vault-managed service principal credentials.
# Exposes isolated Azure/Docker credential directories; callers must remove them.

name: Azure ACR login

description: Authenticate to Azure and ACR using Vault-managed service principal credentials

inputs:
  acr-domain:
    description: Azure Container Registry domain
    required: true
  azure-client-id-vault-selector:
    description: Vault API path and key for the Azure client ID (path key); the AppRole must have read access
    required: true
  azure-client-secret-vault-selector:
    description: Vault API path and key for the Azure client secret (path key); the AppRole must have read access
    required: true
  azure-subscription-id:
    description: Azure subscription ID
    required: true
  azure-tenant-id:
    description: Azure tenant ID
    required: true
  vault-approle-role-id:
    description: Vault AppRole role ID
    required: true
  vault-approle-secret-id:
    description: Vault AppRole secret ID
    required: true
  vault-url:
    description: Vault URL
    required: true

outputs:
  azure-client-id:
    description: Masked Azure client ID for subsequent steps in this job only
    value: ${{ steps.vault.outputs.AZURE_CLIENT_ID }}
  azure-client-secret:
    description: Masked Azure client secret for subsequent steps in this job only
    value: ${{ steps.vault.outputs.AZURE_CLIENT_SECRET }}

runs:
  using: composite
  steps:
    - name: Fetch Azure credentials from HashiCorp Vault
      id: vault
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        exportEnv: false
        exportToken: false
        method: approle
        roleId: ${{ inputs.vault-approle-role-id }}
        secretId: ${{ inputs.vault-approle-secret-id }}
        secrets: |
          ${{ inputs.azure-client-id-vault-selector }} | AZURE_CLIENT_ID;
          ${{ inputs.azure-client-secret-vault-selector }} | AZURE_CLIENT_SECRET;
        url: ${{ inputs.vault-url }}
    - name: Authenticate to Azure and setup ACR credentials
      shell: bash
      env:
        ACR_DOMAIN: ${{ inputs.acr-domain }}
        AZURE_CLIENT_ID: ${{ steps.vault.outputs.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ steps.vault.outputs.AZURE_CLIENT_SECRET }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
        AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
      run: |
        set -euo pipefail
        umask 077

        azure_config_dir="$(mktemp -d "$RUNNER_TEMP/cdcp-azure.XXXXXX")"
        docker_config_dir="$(mktemp -d "$RUNNER_TEMP/cdcp-docker.XXXXXX")"
        export AZURE_CONFIG_DIR="$azure_config_dir"
        export DOCKER_CONFIG="$docker_config_dir"
        {
          printf 'AZURE_CONFIG_DIR=%s\n' "$AZURE_CONFIG_DIR"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG"
        } >> "$GITHUB_ENV"

        echo "Authenticating to Azure with the Vault-managed service principal..."
        if az login --service-principal \
          --tenant "$AZURE_TENANT_ID" \
          --username "$AZURE_CLIENT_ID" \
          --password "$AZURE_CLIENT_SECRET" \
          --output none >/dev/null 2>&1; then
          echo "Azure authentication succeeded."
        else
          login_status=$?
          printf '::error::Azure authentication failed (exit code %s). Check Vault credentials, tenant configuration, and Azure connectivity. Raw CLI output is suppressed to protect credentials.\n' "$login_status" >&2
          exit "$login_status"
        fi

        echo "Authenticating Docker to Azure Container Registry..."
        if az acr login --name "${ACR_DOMAIN%%.*}" \
          --subscription "$AZURE_SUBSCRIPTION_ID" \
          --output none >/dev/null 2>&1; then
          echo "Azure Container Registry authentication succeeded."
        else
          login_status=$?
          printf '::error::Azure Container Registry authentication failed (exit code %s). Check registry configuration, service principal permissions, and registry connectivity. Raw CLI output is suppressed to protect credentials.\n' "$login_status" >&2
          exit "$login_status"
        fi
