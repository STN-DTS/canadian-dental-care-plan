# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Creates queued/completed Slack payloads with source-run metadata and artifact links.
# Finds queued parents in Slack history; the caller supplies credentials and posts messages.

name: Prepare Slack completion

description: Create queued and threaded completion payloads using workflow metadata and artifact links

inputs:
  channel-id:
    description: Destination Slack channel
    required: true
  github-token:
    description: Token with actions read permission for artifact lookup
    required: true
  slack-token:
    description: Optional bot token with channel history access for queued-message lookup
    required: false
    default: ''
outputs:
  payload:
    description: JSON chat.postMessage payload without authentication credentials
    value: ${{ steps.message.outputs.payload }}
runs:
  using: composite
  steps:
    - name: Prepare workflow notification payload
      id: message
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        SLACK_BOT_TOKEN: ${{ inputs.slack-token }}
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
      run: node "$ACTION_PATH/prepare-payload.mjs"
