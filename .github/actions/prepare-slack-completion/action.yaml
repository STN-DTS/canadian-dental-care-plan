# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Creates a Slack completion payload with source-run status and artifact links.
# Reads GitHub metadata only; posting the payload and supplying Slack credentials are caller responsibilities.

name: Prepare Slack completion

description: Create a Slack completion payload with workflow status and source-run artifact links

inputs:
  channel-id:
    description: Destination Slack channel
    required: true
  github-token:
    description: Token with actions read permission for artifact lookup
    required: true
outputs:
  payload:
    description: JSON chat.postMessage payload without authentication credentials
    value: ${{ steps.message.outputs.payload }}
runs:
  using: composite
  steps:
    - name: Prepare completion payload
      id: message
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
      run: node "$ACTION_PATH/prepare-payload.mjs"
