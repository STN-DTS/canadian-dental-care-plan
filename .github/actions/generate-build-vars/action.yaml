name: Generate build variables

description: Generate build metadata for main, release, feature branch, and tag images

inputs:
  version:
    description: Version string used in build metadata
    required: true

outputs:
  build-date:
    description: UTC build date
    value: ${{ steps.build-vars.outputs.build-date }}
  build-number:
    description: GitHub run number formatted as hexadecimal
    value: ${{ steps.build-vars.outputs.build-number }}
  build-revision:
    description: Revision used to tag the image
    value: ${{ steps.build-vars.outputs.build-revision }}
  build-version:
    description: Version string supplied by the caller
    value: ${{ steps.build-vars.outputs.build-version }}
  image-version:
    description: Version used in image metadata, including the RC label for release branches
    value: ${{ steps.build-vars.outputs.image-version }}
  rc-label:
    description: GitHub run number formatted as a decimal release candidate label
    value: ${{ steps.build-vars.outputs.rc-label }}
  scan-timestamp:
    description: UTC timestamp used in scan report names
    value: ${{ steps.build-vars.outputs.scan-timestamp }}
  short-sha:
    description: First eight characters of the source commit SHA
    value: ${{ steps.build-vars.outputs.short-sha }}

runs:
  using: composite
  steps:
    - name: Generate dynamic build variables
      id: build-vars
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        RUN_NUMBER: ${{ github.run_number }}
        SOURCE_SHA: ${{ github.sha }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        BUILD_NUMBER=$(printf '%05x' "$RUN_NUMBER")
        RC_LABEL=$(printf '%03d' "$RUN_NUMBER")
        SHORT_SHA=${SOURCE_SHA:0:8}
        IMAGE_VERSION="$VERSION"
        if [[ "$REF_TYPE" != "tag" && "$REF_NAME" == release/* ]]; then
          IMAGE_VERSION="${VERSION}-RC${RC_LABEL}"
        fi

        if [[ "$REF_TYPE" == "tag" ]]; then
          BUILD_REVISION="$SHORT_SHA"
        elif [[ "$REF_NAME" == "main" ]]; then
          BUILD_REVISION="${VERSION}-${SHORT_SHA}-${BUILD_NUMBER}"
        else
          SANITIZED_BRANCH=$(printf '%s' "$REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^[._-]+//; s/[._-]+$//' \
            | cut -c1-119 \
            | sed -E 's/[._-]+$//')
          SANITIZED_BRANCH=${SANITIZED_BRANCH:-branch}
          BUILD_REVISION="${SANITIZED_BRANCH}-${SHORT_SHA}"
        fi

        {
          echo "build-date=${BUILD_DATE}"
          echo "build-number=${BUILD_NUMBER}"
          echo "build-revision=${BUILD_REVISION}"
          echo "build-version=${VERSION}"
          echo "image-version=${IMAGE_VERSION}"
          echo "rc-label=${RC_LABEL}"
          echo "scan-timestamp=$(date -u +'%Y%m%d-%H%M%S')"
          echo "short-sha=${SHORT_SHA}"
        } >> "$GITHUB_OUTPUT"
