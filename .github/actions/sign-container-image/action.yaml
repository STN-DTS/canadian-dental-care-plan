# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Signs an immutable OCI image digest with a Vault-managed key and verifies it.
# Requires existing registry credentials and a repository Cosign public key.

name: Sign container image

description: Sign an immutable OCI image digest with a Vault-managed key and verify it with Cosign

inputs:
  image-ref:
    description: Full registry image reference including an immutable sha256 digest
    required: true
  public-key-path:
    description: Path to the cosign public key in the repository
    required: true
  vault-approle-role-id:
    description: Vault AppRole role ID
    required: true
  vault-approle-secret-id:
    description: Vault AppRole secret ID
    required: true
  vault-url:
    description: Vault URL
    required: true

runs:
  using: composite
  steps:
    - name: Fetch Cosign key from HashiCorp Vault
      id: cosign
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        exportEnv: false
        method: approle
        roleId: ${{ inputs.vault-approle-role-id }}
        secretId: ${{ inputs.vault-approle-secret-id }}
        secrets: |
          canada-dental-care-plan/data/shared/cicd/cosign COSIGN_PRIVATE_KEY | COSIGN_PRIVATE_KEY;
          canada-dental-care-plan/data/shared/cicd/cosign COSIGN_PASSWORD | COSIGN_PASSWORD;
        url: ${{ inputs.vault-url }}
    - name: Install envsubst
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v envsubst >/dev/null 2>&1; then
          sudo -n apt-get update
          sudo -n apt-get install --yes gettext-base
        fi
        command -v envsubst >/dev/null
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Sign and verify immutable image digest
      shell: bash
      env:
        COSIGN_PASSWORD: ${{ steps.cosign.outputs.COSIGN_PASSWORD }}
        COSIGN_PRIVATE_KEY: ${{ steps.cosign.outputs.COSIGN_PRIVATE_KEY }}
        IMAGE: ${{ inputs.image-ref }}
        PUB_KEY: ${{ inputs.public-key-path }}
      run: |
        set -euo pipefail

        image_digest="${IMAGE##*@}"

        if [[ ! "$IMAGE" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]]; then
          echo "Expected an image reference with an immutable sha256 digest." >&2
          exit 1
        fi

        signing_config="$(mktemp "$RUNNER_TEMP/cosign-signing-config.XXXXXX")"
        trap 'rm -f "$signing_config"' EXIT
        cosign signing-config create --out "$signing_config"
        cosign sign --yes --signing-config "$signing_config" --key env://COSIGN_PRIVATE_KEY "$IMAGE"
        cosign verify --insecure-ignore-tlog --key "$PUB_KEY" "$IMAGE"

        {
          printf '## Signed OCI image\n\n'
          printf '| Image | Digest |\n| --- | --- |\n'
          printf '| `%s` | `%s` |\n' "$IMAGE" "$image_digest"
        } >> "$GITHUB_STEP_SUMMARY"
