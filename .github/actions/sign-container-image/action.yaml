name: Sign container image
description: Sign and verify an immutable OCI image digest with Cosign and HashiCorp Vault

inputs:
  image:
    description: Full registry image reference including an immutable sha256 digest
    required: true
  vault-url:
    description: Vault URL
    required: true
  vault-role-id:
    description: Vault AppRole role ID
    required: true
  vault-secret-id:
    description: Vault AppRole secret ID
    required: true
  cosign-vault-path:
    description: Vault KV path holding COSIGN_PRIVATE_KEY and COSIGN_PASSWORD
    required: true
  public-key-path:
    description: Path to the cosign public key in the repository
    default: .github/actions/sign-container-image/cosign.pub

runs:
  using: composite
  steps:
    - name: Fetch Cosign key from HashiCorp Vault
      id: cosign
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        method: approle
        url: ${{ inputs.vault-url }}
        roleId: ${{ inputs.vault-role-id }}
        secretId: ${{ inputs.vault-secret-id }}
        exportEnv: false
        secrets: |
          ${{ inputs.cosign-vault-path }} COSIGN_PRIVATE_KEY | COSIGN_PRIVATE_KEY;
          ${{ inputs.cosign-vault-path }} COSIGN_PASSWORD | COSIGN_PASSWORD;
    - name: Install envsubst (gettext)
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update && sudo apt-get install --yes gettext-base
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3
    - name: Sign and verify immutable image digest
      shell: bash
      env:
        COSIGN_PRIVATE_KEY: ${{ steps.cosign.outputs.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ steps.cosign.outputs.COSIGN_PASSWORD }}
        IMAGE: ${{ inputs.image }}
        PUB_KEY: ${{ inputs.public-key-path }}
      run: |
        set -euo pipefail

        image_digest="${IMAGE##*@}"

        if [[ ! "$IMAGE" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]]; then
          echo "Expected an image reference with an immutable sha256 digest." >&2
          exit 1
        fi

        signing_config="$(mktemp "$RUNNER_TEMP/cosign-signing-config.XXXXXX")"
        trap 'rm -f "$signing_config"' EXIT
        cosign signing-config create --out "$signing_config"
        cosign sign --yes --signing-config "$signing_config" --key env://COSIGN_PRIVATE_KEY "$IMAGE"
        cosign verify --insecure-ignore-tlog --key "$PUB_KEY" "$IMAGE"

        {
          printf '## Signed OCI image\n\n'
          printf '| Image | Digest |\n| --- | --- |\n'
          printf '| `%s` | `%s` |\n' "$IMAGE" "$image_digest"
        } >> "$GITHUB_STEP_SUMMARY"
