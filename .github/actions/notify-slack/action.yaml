# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Notify Slack
description: Send a build notification to Slack using a bot token stored in HashiCorp Vault

inputs:
  vault-url:
    description: Vault URL
    required: true
  vault-role-id:
    description: Vault AppRole role ID
    required: true
  vault-secret-id:
    description: Vault AppRole secret ID
    required: true
  channel-id:
    description: Slack channel ID where the bot posts the notification
    required: true
  thread-ts:
    description: Parent Slack message timestamp; omit to post a new message
    default: ""
  status:
    description: Build status to report, such as started, success, failure, or cancelled
    required: true
  message:
    description: Optional additional notification text
    default: ""
  job-results:
    description: JSON needs context for reporting failed build and test jobs
    default: "{}"
  image-ref:
    description: Optional immutable published image reference including its sha256 digest
    default: ""
  github-token:
    description: Optional token with actions read permission for completion elapsed time
    default: ""
  workflow-name:
    description: Name of the workflow being reported
    default: ${{ github.workflow }}
  run-url:
    description: URL of the workflow run being reported
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ref:
    description: Branch or tag being reported
    default: ${{ github.ref_name }}
  commit-sha:
    description: Exact source commit being reported
    default: ${{ github.sha }}

outputs:
  ts:
    description: Timestamp of the posted Slack message
    value: ${{ steps.notification.outputs.ts }}

runs:
  using: composite
  steps:
    - name: Validate Slack channel
      shell: bash
      env:
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
      run: |
        if [[ -z "${SLACK_CHANNEL_ID//[[:space:]]/}" ]]; then
          echo "::error::The channel-id input is required."
          exit 1
        fi
    - name: Fetch Slack bot token from HashiCorp Vault
      id: vault
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        method: approle
        url: ${{ inputs.vault-url }}
        roleId: ${{ inputs.vault-role-id }}
        secretId: ${{ inputs.vault-secret-id }}
        exportEnv: false
        exportToken: false
        secrets: |
          canada-dental-care-plan/data/shared/cicd/slack SLACK_BOT_TOKEN | SLACK_BOT_TOKEN;
    - name: Prepare Slack Notification
      id: prepare-notification
      shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        REF_NAME: ${{ inputs.ref }}
        ACTOR: ${{ github.triggering_actor || github.actor }}
        JOB_RESULTS: ${{ inputs.job-results }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        GH_TOKEN: ${{ inputs.github-token }}
        API_URL: ${{ github.api_url }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        NOTIFICATION_STATUS: ${{ inputs.status }}
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
        THREAD_TS: ${{ inputs.thread-ts }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
        RUN_URL: ${{ inputs.run-url }}
        MESSAGE: ${{ inputs.message }}
        IMAGE_REF: ${{ inputs.image-ref }}
        EVENT_NAME: ${{ github.event_name }}
        RUN_NUMBER: ${{ github.run_number }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/prepare-notification.mjs"
    - name: Post notification to Slack
      id: notification
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ steps.vault.outputs.SLACK_BOT_TOKEN }}
        errors: true
        payload: ${{ steps.prepare-notification.outputs.payload }}
