# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Notify Slack
description: Send a build notification to Slack using a bot token stored in HashiCorp Vault

inputs:
  vault-url:
    description: Vault URL
    required: true
  vault-role-id:
    description: Vault AppRole role ID
    required: true
  vault-secret-id:
    description: Vault AppRole secret ID
    required: true
  channel-id:
    description: Slack channel ID where the bot posts the notification
    required: true
  status:
    description: Build status to report, such as started, success, failure, or cancelled
    required: true
  message:
    description: Optional additional notification text
    default: ""
  workflow-name:
    description: Name of the workflow being reported
    default: ${{ github.workflow }}
  run-url:
    description: URL of the workflow run being reported
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ref:
    description: Branch or tag being reported
    default: ${{ github.ref_name }}

runs:
  using: composite
  steps:
    - name: Validate Slack channel
      shell: bash
      env:
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
      run: |
        if [[ -z "${SLACK_CHANNEL_ID//[[:space:]]/}" ]]; then
          echo "::error::The channel-id input is required."
          exit 1
        fi
    - name: Fetch Slack bot token from HashiCorp Vault
      id: vault
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        method: approle
        url: ${{ inputs.vault-url }}
        roleId: ${{ inputs.vault-role-id }}
        secretId: ${{ inputs.vault-secret-id }}
        exportEnv: false
        exportToken: false
        secrets: |
          canada-dental-care-plan/data/shared/cicd/slack SLACK_BOT_TOKEN | SLACK_BOT_TOKEN;
    - name: Prepare GitHub links
      id: links
      shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        REF_NAME: ${{ inputs.ref }}
        ACTOR: ${{ github.triggering_actor || github.actor }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const escapeLabel = (value) => value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\|/g, '&#124;');
        const { SERVER_URL, REPOSITORY, REF_NAME, ACTOR } = process.env;
        const repositoryUrl = `${SERVER_URL}/${REPOSITORY}`;
        const links = {
          repository: `Repository: <${repositoryUrl}|${escapeLabel(REPOSITORY)}>`,
          ref: `Ref: <${repositoryUrl}/tree/${encodeURIComponent(REF_NAME)}|${escapeLabel(REF_NAME)}>`,
          actor: `By <${SERVER_URL}/${encodeURIComponent(ACTOR)}|${escapeLabel(ACTOR)}>`
        };
        for (const [name, value] of Object.entries(links)) {
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${JSON.stringify(value)}\n`);
        }
        NODE
    - name: Post notification to Slack
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ steps.vault.outputs.SLACK_BOT_TOKEN }}
        errors: true
        payload: |
          {
            "channel": ${{ toJSON(inputs.channel-id) }},
            "text": ${{ toJSON(format('{0}: {1}. {2}', inputs.workflow-name, inputs.status, inputs.run-url)) }},
            "attachments": [
              {
                "color": ${{ toJSON(inputs.status == 'success' && 'good' || inputs.status == 'failure' && 'danger' || inputs.status == 'cancelled' && 'warning' || inputs.status == 'started' && '#359FA3' || '#808080') }},
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "plain_text",
                      "text": ${{ toJSON(inputs.workflow-name) }}
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "plain_text",
                        "text": ${{ toJSON(format('Status: {0}', inputs.status == 'success' && 'Succeeded' || inputs.status == 'failure' && 'Failed' || inputs.status == 'cancelled' && 'Cancelled' || inputs.status == 'started' && 'Started' || inputs.status == 'skipped' && 'Skipped' || inputs.status)) }}
                      },
                      {
                        "type": "mrkdwn",
                        "text": ${{ steps.links.outputs.ref }}
                      },
                      {
                        "type": "mrkdwn",
                        "text": ${{ steps.links.outputs.repository }}
                      },
                      {
                        "type": "plain_text",
                        "text": ${{ toJSON(format('Trigger: {0}', github.event_name)) }}
                      }
                    ]
                  },
                  ${{ inputs.message && format('{{"type":"section","text":{{"type":"plain_text","text":{0}}}}},', toJSON(inputs.message)) || '' }}
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": ${{ toJSON(format('Run #{0} | Attempt {1} | {2}', github.run_number, github.run_attempt, fromJSON(steps.links.outputs.actor))) }}
                      }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "action_id": "view_workflow_run",
                        "text": {
                          "type": "plain_text",
                          "text": "View workflow run"
                        },
                        "url": ${{ toJSON(inputs.run-url) }}
                      }
                    ]
                  }
                ]
              }
            ]
          }
