# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Notify Slack
description: Send a build notification to Slack using a bot token stored in HashiCorp Vault

inputs:
  vault-url:
    description: Vault URL
    required: true
  vault-role-id:
    description: Vault AppRole role ID
    required: true
  vault-secret-id:
    description: Vault AppRole secret ID
    required: true
  channel-id:
    description: Slack channel ID where the bot posts the notification
    required: true
  status:
    description: Build status to report, such as queued, success, failure, or cancelled
    required: true
  run-id:
    description: ID of the reported workflow run, used for message correlation
    default: ${{ github.run_id }}
  run-created-at:
    description: Source run creation time for bounding Slack history lookup
    default: ""
  job-results:
    description: JSON job results retrieved from the reported workflow run attempt
    default: "{}"
  workflow-name:
    description: Name of the workflow being reported
    default: ${{ github.workflow }}
  run-url:
    description: URL of the workflow run being reported
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ref:
    description: Branch or tag being reported
    default: ${{ github.ref_name }}
  commit-sha:
    description: Exact source commit being reported
    default: ${{ github.sha }}
  actor:
    description: Actor who triggered the reported workflow
    default: ${{ github.triggering_actor || github.actor }}
  event-name:
    description: Event that triggered the reported workflow
    default: ${{ github.event_name }}
  run-number:
    description: Number of the reported workflow run
    default: ${{ github.run_number }}
  run-attempt:
    description: Attempt of the reported workflow run
    default: ${{ github.run_attempt }}

outputs:
  ts:
    description: Timestamp of the posted Slack message
    value: ${{ steps.notification.outputs.ts }}

runs:
  using: composite
  steps:
    - name: Validate Slack channel
      shell: bash
      env:
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
      run: |
        if [[ -z "${SLACK_CHANNEL_ID//[[:space:]]/}" ]]; then
          echo "::error::The channel-id input is required."
          exit 1
        fi
    - name: Ensure Node.js runtime libraries
      shell: bash
      run: |
        set -euo pipefail

        if ! ldconfig -p | grep -F 'libatomic.so.1' >/dev/null; then
          sudo -n apt-get update
          sudo -n apt-get install --yes libatomic1
        fi
    - name: Setup Node.js for notification preparation
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.10.0
    - name: Fetch Slack bot token from HashiCorp Vault
      id: vault
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        method: approle
        url: ${{ inputs.vault-url }}
        roleId: ${{ inputs.vault-role-id }}
        secretId: ${{ inputs.vault-secret-id }}
        exportEnv: false
        exportToken: false
        secrets: |
          canada-dental-care-plan/data/shared/cicd/slack SLACK_BOT_TOKEN | SLACK_BOT_TOKEN;
    - name: Find existing workflow message
      id: state
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ steps.vault.outputs.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        RUN_URL: ${{ inputs.run-url }}
        RUN_CREATED_AT: ${{ inputs.run-created-at }}
        NOTIFICATION_STATUS: ${{ inputs.status }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/workflow-message-state.mjs"
    - name: Prepare Slack Notification
      id: prepare-notification
      if: ${{ steps.state.outputs.should-post == 'true' }}
      shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        REF_NAME: ${{ inputs.ref }}
        ACTOR: ${{ inputs.actor }}
        JOB_RESULTS: ${{ inputs.job-results }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        RUN_ID: ${{ inputs.run-id }}
        NOTIFICATION_STATUS: ${{ inputs.status }}
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
        MESSAGE_TS: ${{ steps.state.outputs.message-ts }}
        RUN_URL: ${{ inputs.run-url }}
        EVENT_NAME: ${{ inputs.event-name }}
        RUN_NUMBER: ${{ inputs.run-number }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/prepare-notification.mjs"
    - name: Post notification to Slack
      id: notification
      if: ${{ steps.state.outputs.should-post == 'true' }}
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: ${{ steps.state.outputs.message-ts != '' && 'chat.update' || 'chat.postMessage' }}
        token: ${{ steps.vault.outputs.SLACK_BOT_TOKEN }}
        errors: true
        payload: ${{ steps.prepare-notification.outputs.payload }}
