name: Aqua scan
description: Scan a local container image with Trivy and Aqua

inputs:
  image-ref:
    description: Full container image reference to scan
    required: true
  artifact-prefix:
    description: Prefix used for scan report files and artifacts
    required: true
  vault-url:
    description: Vault URL
    required: true
  vault-role-id:
    description: Vault AppRole role ID
    required: true
  vault-secret-id:
    description: Vault AppRole secret ID
    required: true
  scan-timestamp:
    description: Timestamp used in scan report filenames
    required: true

runs:
  using: composite
  steps:
    - name: Fetch Aqua credentials from HashiCorp Vault
      id: vault
      uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
      with:
        method: approle
        url: ${{ inputs.vault-url }}
        roleId: ${{ inputs.vault-role-id }}
        secretId: ${{ inputs.vault-secret-id }}
        exportEnv: false
        secrets: |
          canada-dental-care-plan/data/shared/cicd/aquasec AQUA_HOST | AQUA_HOST;
          canada-dental-care-plan/data/shared/cicd/aquasec AQUA_USERNAME | AQUA_USERNAME;
          canada-dental-care-plan/data/shared/cicd/aquasec AQUA_PASSWORD | AQUA_PASSWORD;
          canada-dental-care-plan/data/shared/cicd/aquasec AQUA_POLICIES | AQUA_POLICIES;
    - name: Create Aqua reports directories and fetch Trivy template
      shell: bash
      env:
        TRIVY_TEMPLATE_COMMIT: 6fb20c8edd70745d6b34bff0387b53b03c8a760a
        TRIVY_TEMPLATE_SHA256: d36b637cc77bc1a49b1f9a2358173756cd27a5d3385fab6365c0bab09abe5f0a
      run: |
        set -euo pipefail

        mkdir -p .github/aqua-reports contrib
        curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_TEMPLATE_COMMIT}/contrib/html.tpl" -o contrib/html.tpl
        printf '%s  %s\n' "$TRIVY_TEMPLATE_SHA256" contrib/html.tpl | sha256sum --check
    - name: Run Aqua vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      with:
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln
        format: template
        template: "@contrib/html.tpl"
        output: .github/aqua-reports/aqua-scan-report-${{ inputs.artifact-prefix }}-${{ inputs.scan-timestamp }}.html
    - name: Upload Aqua scan report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: aqua-scan-report-${{ inputs.artifact-prefix }}
        path: .github/aqua-reports/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Run Aqua scannercli
      id: scanner
      if: ${{ !env.ACT }}
      continue-on-error: true
      shell: bash
      env:
        AQUA_HOST: ${{ steps.vault.outputs.AQUA_HOST }}
        AQUA_PASSWORD: ${{ steps.vault.outputs.AQUA_PASSWORD }}
        AQUA_POLICIES: ${{ steps.vault.outputs.AQUA_POLICIES }}
        AQUA_USERNAME: ${{ steps.vault.outputs.AQUA_USERNAME }}
        IMAGE_REF: ${{ inputs.image-ref }}
        REPORT_FILE: scannercli-report-${{ inputs.artifact-prefix }}-${{ inputs.scan-timestamp }}.html
      run: |
        set -euo pipefail

        password_file="$(mktemp "$RUNNER_TEMP/aqua-password.XXXXXX")"
        trap 'rm -f "$password_file"' EXIT
        chmod 600 "$password_file"
        printf '%s' "$AQUA_PASSWORD" > "$password_file"

        if docker run --rm \
          --env AQUA_HOST \
          --env AQUA_POLICIES \
          --env AQUA_USERNAME \
          --env IMAGE_REF \
          --env REPORT_FILE \
          --volume /var/run/docker.sock:/var/run/docker.sock \
          --volume "$GITHUB_WORKSPACE/.github/aqua-reports:/reports" \
          --volume "$password_file:/run/secrets/aqua-password:ro" \
          --entrypoint /bin/sh \
          asttsa-security-tools-docker.nxrm.itsec.esdc-edsc.canada.ca/aquasec/scanner:2022.4.805 \
          -c 'AQUA_PASSWORD="$(cat /run/secrets/aqua-password)"; exec /opt/aquasec/scannercli scan --host "$AQUA_HOST" --user "$AQUA_USERNAME" --password "$AQUA_PASSWORD" \
            --policies "$AQUA_POLICIES" --local "$IMAGE_REF" --htmlfile "/reports/$REPORT_FILE"'; then
          scan_status=0
        else
          scan_status=$?
        fi
        printf 'exit-code=%s\n' "$scan_status" >> "$GITHUB_OUTPUT"
        if (( scan_status == 4 )); then
          printf '::warning::Aqua scan completed, but compliance policies failed; publishing continues in advisory mode.\n'
        elif (( scan_status != 0 )); then
          printf '::warning::Aqua scannercli execution failed with exit code %s; publishing continues without a completed Aqua scan.\n' "$scan_status"
        fi
        exit "$scan_status"
    - name: Upload scannercli report
      id: scanner-report
      if: ${{ always() && !env.ACT }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scannercli-report-${{ inputs.artifact-prefix }}
        path: .github/aqua-reports/scannercli-report-${{ inputs.artifact-prefix }}-*
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Summarize Aqua scanner result
      if: ${{ always() && !env.ACT }}
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        SCAN_EXIT_CODE: ${{ steps.scanner.outputs.exit-code }}
        REPORT_URL: ${{ steps.scanner-report.outputs.artifact-url }}
      run: |
        set -euo pipefail

        case "$SCAN_EXIT_CODE" in
          0)
            result='Scan completed; compliance passed'
            next_steps='No compliance failure was reported by scannercli.'
            ;;
          4)
            result='Scan completed; compliance policies failed'
            next_steps='Review the scanner report or Aqua Console for the failed controls and affected packages. Remediate the findings or follow the approved exception process.'
            ;;
          125)
            result='Scanner container could not start'
            next_steps='Check the scanner logs for image download, registry connectivity, or Docker setup failures. Compliance was not evaluated.'
            ;;
          126|127)
            result='Scanner command could not execute'
            next_steps='Check the scanner image, executable path, and permissions. Compliance was not evaluated.'
            ;;
          '')
            result='Scanner result unavailable'
            next_steps='Check earlier action steps and scanner logs. No completed scan can be confirmed.'
            ;;
          *)
            result='Scanner returned an unexpected failure'
            next_steps='Review the scanner logs and any available report before determining whether compliance was evaluated.'
            ;;
        esac

        {
          printf '## Aqua scanner result\n\n'
          printf '| Field | Value |\n| --- | --- |\n'
          printf '| Image | `%s` |\n' "$IMAGE_REF"
          printf '| Result | %s |\n' "$result"
          printf '| Exit code | `%s` |\n' "${SCAN_EXIT_CODE:-unavailable}"
          printf '| Enforcement | Advisory; scannercli does not block publishing |\n'
          if [[ -n "$REPORT_URL" ]]; then
            printf '| Report | [Download scanner report](%s) |\n' "$REPORT_URL"
          else
            printf '| Report | No scanner report artifact is available |\n'
          fi
          printf '\n%s\n\n' "$next_steps"
          printf '[Workflow logs](%s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          printf 'Vault-derived policy names, credentials, and raw scanner output are omitted from this summary.\n'
          if [[ "$SCAN_EXIT_CODE" != 0 ]]; then
            printf '\nPublication or signature success does not establish Aqua compliance.\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
