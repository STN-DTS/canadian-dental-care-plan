# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Pushes the primary image and optional extra tags, returning the primary digest.
# Uses runner Docker credentials and reports published tags in the job summary.

name: Push container image

description: Push OCI image tags, summarize publication, and return the primary image digest

inputs:
  additional-image-refs:
    description: Optional newline-separated image references to push after the primary image
    default: ''
  application-name:
    description: Application label in the published tags summary
    default: CDCP frontend
  image-ref:
    description: Primary local image reference to push
    required: true

outputs:
  image-digest:
    description: Immutable sha256 digest returned by the primary image push

runs:
  using: node24
  main: push-image.mjs
