# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: Setup pnpm, Node.js, and dependencies

description: Install the workspace toolchain and dependencies with lockfile-based pnpm caching

inputs:
  install:
    description: Install workspace dependencies after setting up the toolchain
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm, Node.js, and dependencies
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        require-lockfile: true
        install: ${{ inputs.install }}
