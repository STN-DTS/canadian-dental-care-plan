# @see https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Pause version-update PRs during the Renovate transition; security updates remain independent.
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      dev-minor-versions:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - 'react-router'
          - '@react-router/*'
      prod-minor-versions:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - 'react-router'
          - '@react-router/*'
      react-router-versions:
        update-types:
          - minor
          - patch
        patterns:
          - 'react-router'
          - '@react-router/*'

  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directory: /frontend
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    # Ignore major updates
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: terraform
    open-pull-requests-limit: 0
    directory: /infrastructure
    schedule:
      interval: daily
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    # Root covers workflows; composite actions need their own directories.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    cooldown:
      default-days: 3
