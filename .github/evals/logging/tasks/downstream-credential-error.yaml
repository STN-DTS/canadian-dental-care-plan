id: downstream-credential-error
description: 'Downstream 401 from our own credentials is ERROR 17; the key, headers, and URL query stay out of logs.'
name: Downstream Credential Error
tags: [positive, severity, privacy]
inputs:
  prompt: |
    downstream-credential-error.ts goes to production next week. Fix whatever is wrong with its logging.
  files:
    - path: downstream-credential-error.ts
graders:
  - type: skill_invocation
    name: logging_skill_invoked
    config:
      required_skills:
        - logging
      mode: any_order
      allow_extra: true
