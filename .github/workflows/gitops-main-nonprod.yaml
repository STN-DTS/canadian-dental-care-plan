# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Monitors gitops/nonprod on main and applies selected Kustomizations to the
# nonprod AKS cluster when changes are pushed.
# Manual and reusable runs apply all overlays; deployments are restricted to main.

name: GitOps operator (nonprod)

permissions:
  contents: read

concurrency:
  group: gitops-nonprod-${{ vars.NONPROD_AKS_CLUSTER_NAME }}
  cancel-in-progress: false
  queue: max

on:
  push:
    branches:
      - main
    paths:
      - gitops/nonprod/**
      - .github/workflows/gitops-main-nonprod.yaml
  workflow_call: {}
  workflow_dispatch:
    inputs:
      debug:
        description: Print tool versions and non-sensitive deployment context
        required: false
        default: "false"

env:
  CI: true

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::GitOps deployments are restricted to the main branch."
          exit 1

      - name: Allow non-fork repository
        run: echo "Repository check passed."

  detect-changes:
    needs: check-repository
    runs-on: ubuntu-latest
    outputs:
      overlays: ${{ steps.selection.outputs.overlays }}
      overlay-list: ${{ steps.selection.outputs.overlay-list }}
      shared: ${{ steps.selection.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover overlays
        id: discovery
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'gitops/nonprod/overlays';
          const manifests = ['kustomization.yaml', 'kustomization.yml', 'Kustomization'];
          const names = fs.readdirSync(root, { withFileTypes: true })
            .filter(entry => entry.isDirectory() && manifests.some(file => fs.existsSync(path.join(root, entry.name, file))))
            .map(entry => entry.name)
            .sort();
          if (!names.includes('shared')) throw new Error('The shared overlay is required.');
          if (names.some(name => !/^[a-z0-9][a-z0-9-]*$/.test(name))) throw new Error('Overlay names must contain only lowercase letters, digits, and hyphens.');
          const overlays = names.filter(name => name !== 'shared');
          const filters = {
            all: ['.github/workflows/gitops-main-nonprod.yaml', 'gitops/nonprod/base/**'],
            shared: [
              '.github/workflows/gitops-main-nonprod.yaml',
              `${root}/shared/**`,
              'gitops/nonprod/base/maintenance/**',
              'gitops/nonprod/base/reloader/**',
              'gitops/nonprod/base/squid-proxy/**',
            ],
          };
          for (const overlay of overlays) filters[`overlay_${overlay}`] = [`${root}/${overlay}/**`];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `overlays=${JSON.stringify(overlays)}\nfilters=${JSON.stringify(filters)}\n`);
          NODE

      - name: Detect changed overlays
        if: ${{ github.event_name == 'push' && github.event.created != true }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.before }}
          filters: ${{ steps.discovery.outputs.filters }}

      - name: Select deployment targets
        id: selection
        env:
          FULL_DEPLOY: ${{ github.event_name != 'push' || github.event.created == true }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          OVERLAYS: ${{ steps.discovery.outputs.overlays }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const overlays = JSON.parse(process.env.OVERLAYS);
          const changes = JSON.parse(process.env.CHANGES || '[]');
          const fullDeploy = process.env.FULL_DEPLOY === 'true';
          const selected = fullDeploy || changes.includes('all')
            ? overlays
            : overlays.filter(overlay => changes.includes(`overlay_${overlay}`));
          const shared = fullDeploy || changes.includes('shared');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `overlays=${JSON.stringify(selected)}\noverlay-list=${selected.join(' ')}\nshared=${shared}\n`);
          NODE

  apply-overlays:
    name: Apply GitOps overlays
    needs:
      - check-repository
      - detect-changes
    if: ${{ needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.overlays != '[]' }}
    runs-on: arc-runners-dshp-dev
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch deployment credentials from HashiCorp Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          method: approle
          url: ${{ secrets.NONPROD_VAULT_URL }}
          roleId: ${{ secrets.NONPROD_VAULT_APPROLE_ROLE_ID }}
          secretId: ${{ secrets.NONPROD_VAULT_APPROLE_SECRET_ID }}
          exportEnv: false
          secrets: |
            canada-dental-care-plan/data/SPN SPN_ID | SPN_ID;
            canada-dental-care-plan/data/SPN SPN_PASSWORD | SPN_PASSWORD;

      - name: Authenticate to Azure and configure AKS access
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.NONPROD_AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          K8S_CLUSTER_NAME: ${{ vars.NONPROD_AKS_CLUSTER_NAME }}
          K8S_RESOURCE_GROUP: ${{ vars.NONPROD_AKS_RESOURCE_GROUP }}
          SP_ID: ${{ steps.vault.outputs.SPN_ID }}
          SP_PASSWORD: ${{ steps.vault.outputs.SPN_PASSWORD }}
        run: |
          set -euo pipefail

          umask 077
          azure_config_dir="$(mktemp -d "$RUNNER_TEMP/cdcp-azure.XXXXXX")"
          export AZURE_CONFIG_DIR="$azure_config_dir"
          printf 'AZURE_CONFIG_DIR=%s\n' "$AZURE_CONFIG_DIR" >> "$GITHUB_ENV"
          kubeconfig="$(mktemp "$RUNNER_TEMP/cdcp-nonprod-kubeconfig.XXXXXX")"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

          az login --service-principal \
            --tenant "$AZURE_TENANT_ID" \
            --username "$SP_ID" \
            --password "$SP_PASSWORD"

          az aks get-credentials --overwrite-existing \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$K8S_RESOURCE_GROUP" \
            --name "$K8S_CLUSTER_NAME" \
            --file "$kubeconfig"

          kubelogin convert-kubeconfig \
            --login spn \
            --client-id "$SP_ID" \
            --client-secret "$SP_PASSWORD" \
            --kubeconfig "$kubeconfig"

      - name: Print tool versions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == 'true' }}
        run: |
          set -euo pipefail
          printf 'GITHUB_EVENT_NAME=%s\nGITHUB_REF=%s\nGITHUB_SHA=%s\nGITHUB_RUN_ID=%s\nGITHUB_RUN_ATTEMPT=%s\nRUNNER_NAME=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          az version
          kubectl version --client

      - name: Apply shared overlay
        if: ${{ needs.detect-changes.outputs.shared == 'true' }}
        run: |
          set -euo pipefail
          printf '### Shared Overlay\n\n| Overlay | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          if kubectl --kubeconfig "$KUBECONFIG" apply --kustomize ./gitops/nonprod/overlays/shared/ --force; then
            printf '| `shared` | Success |\n' >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            printf '| `shared` | Failed |\n' >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Apply environment overlays
        if: ${{ needs.detect-changes.outputs.overlays != '[]' }}
        env:
          OVERLAYS: ${{ needs.detect-changes.outputs.overlay-list }}
        run: |
          set -euo pipefail
          read -r -a overlays <<< "$OVERLAYS"
          failed=()
          printf '### Environment Overlays\n\n| Overlay | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for overlay in "${overlays[@]}"; do
            if [[ ! "$overlay" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::Invalid overlay name."
              exit 1
            fi
            printf '::group::Apply %s overlay\n' "$overlay"
            if kubectl --kubeconfig "$KUBECONFIG" apply --kustomize "./gitops/nonprod/overlays/$overlay/" --force; then
              printf 'Applied %s\n' "$overlay"
              printf '| `%s` | Success |\n' "$overlay" >> "$GITHUB_STEP_SUMMARY"
            else
              failed+=("$overlay")
              printf '::error::Failed to apply %s\n' "$overlay"
              printf '| `%s` | Failed |\n' "$overlay" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            printf '::error::Failed overlays: %s\n' "${failed[*]}"
            printf '\n**Failed overlays:** %s\n' "${failed[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Clean up credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${KUBECONFIG:-}" ]]; then
            rm -f -- "$KUBECONFIG"
          fi
          if [[ -n "${AZURE_CONFIG_DIR:-}" && -d "$AZURE_CONFIG_DIR" ]]; then
            az logout || true
            az account clear || true
            rm -rf -- "$AZURE_CONFIG_DIR"
          fi
