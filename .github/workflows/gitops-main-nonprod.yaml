# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Monitors gitops/nonprod on main and applies selected Kustomizations to the
# nonprod AKS cluster when changes are pushed.
# Manual and reusable runs apply all overlays; deployments are restricted to main.

name: GitOps operator (nonprod)

permissions:
  contents: read

concurrency:
  group: gitops-nonprod-${{ vars.NONPROD_AKS_CLUSTER_NAME }}
  cancel-in-progress: false
  queue: max

on:
  push:
    branches:
      - main
    paths:
      - gitops/nonprod/**
      - .github/workflows/gitops-main-nonprod.yaml
  workflow_call: {}
  workflow_dispatch:
    inputs:
      debug:
        description: Print tool versions and non-sensitive deployment context
        required: false
        default: "false"

env:
  CI: true

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::GitOps deployments are restricted to the main branch."
          exit 1

      - name: Allow non-fork repository
        run: echo "Repository check passed."

  detect-changes:
    needs: check-repository
    runs-on: ubuntu-latest
    outputs:
      overlays: ${{ steps.selection.outputs.overlays }}
      shared: ${{ steps.selection.outputs.shared }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' && github.event.created != true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed overlays
        if: ${{ github.event_name == 'push' && github.event.created != true }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.before }}
          filters: |
            all:
              - .github/workflows/gitops-main-nonprod.yaml
              - gitops/nonprod/base/**
            shared:
              - .github/workflows/gitops-main-nonprod.yaml
              - gitops/nonprod/overlays/shared/**
              - gitops/nonprod/base/maintenance/**
              - gitops/nonprod/base/reloader/**
              - gitops/nonprod/base/squid-proxy/**
            dev:
              - gitops/nonprod/overlays/dev/**
            int1:
              - gitops/nonprod/overlays/int1/**
            int2:
              - gitops/nonprod/overlays/int2/**
            otto:
              - gitops/nonprod/overlays/otto/**
            perf:
              - gitops/nonprod/overlays/perf/**
            prototype:
              - gitops/nonprod/overlays/prototype/**
            staging:
              - gitops/nonprod/overlays/staging/**
            training:
              - gitops/nonprod/overlays/training/**
            uat1:
              - gitops/nonprod/overlays/uat1/**
            uat2:
              - gitops/nonprod/overlays/uat2/**

      - name: Select deployment targets
        id: selection
        env:
          FULL_DEPLOY: ${{ github.event_name != 'push' || github.event.created == true }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const overlays = ['dev', 'int1', 'int2', 'otto', 'perf', 'prototype', 'staging', 'training', 'uat1', 'uat2'];
          const changes = JSON.parse(process.env.CHANGES || '[]');
          const fullDeploy = process.env.FULL_DEPLOY === 'true';
          const selected = fullDeploy || changes.includes('all')
            ? overlays
            : overlays.filter(overlay => changes.includes(overlay));
          const shared = fullDeploy || changes.includes('shared');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `overlays=${JSON.stringify(selected)}\nshared=${shared}\n`);
          NODE

  apply-shared:
    name: Apply shared GitOps overlay
    needs:
      - check-repository
      - detect-changes
    if: ${{ needs.detect-changes.outputs.shared == 'true' }}
    runs-on: arc-runners-dshp-dev
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch deployment credentials from HashiCorp Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          method: approle
          url: ${{ secrets.NONPROD_VAULT_URL }}
          roleId: ${{ secrets.NONPROD_VAULT_APPROLE_ROLE_ID }}
          secretId: ${{ secrets.NONPROD_VAULT_APPROLE_SECRET_ID }}
          exportEnv: false
          secrets: |
            canada-dental-care-plan/data/SPN SPN_ID | SPN_ID;
            canada-dental-care-plan/data/SPN SPN_PASSWORD | SPN_PASSWORD;

      - name: Authenticate to Azure and configure AKS access
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.NONPROD_AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          K8S_CLUSTER_NAME: ${{ vars.NONPROD_AKS_CLUSTER_NAME }}
          K8S_RESOURCE_GROUP: ${{ vars.NONPROD_AKS_RESOURCE_GROUP }}
          SP_ID: ${{ steps.vault.outputs.SPN_ID }}
          SP_PASSWORD: ${{ steps.vault.outputs.SPN_PASSWORD }}
        run: |
          set -euo pipefail

          umask 077
          azure_config_dir="$(mktemp -d "$RUNNER_TEMP/cdcp-azure.XXXXXX")"
          export AZURE_CONFIG_DIR="$azure_config_dir"
          printf 'AZURE_CONFIG_DIR=%s\n' "$AZURE_CONFIG_DIR" >> "$GITHUB_ENV"
          kubeconfig="$(mktemp "$RUNNER_TEMP/cdcp-nonprod-kubeconfig.XXXXXX")"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

          az login --service-principal \
            --tenant "$AZURE_TENANT_ID" \
            --username "$SP_ID" \
            --password "$SP_PASSWORD"

          az aks get-credentials --overwrite-existing \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$K8S_RESOURCE_GROUP" \
            --name "$K8S_CLUSTER_NAME" \
            --file "$kubeconfig"

          kubelogin convert-kubeconfig \
            --login spn \
            --client-id "$SP_ID" \
            --client-secret "$SP_PASSWORD" \
            --kubeconfig "$kubeconfig"

      - name: Print tool versions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == 'true' }}
        run: |
          set -euo pipefail
          printf 'GITHUB_EVENT_NAME=%s\nGITHUB_REF=%s\nGITHUB_SHA=%s\nGITHUB_RUN_ID=%s\nGITHUB_RUN_ATTEMPT=%s\nRUNNER_NAME=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          az version
          kubectl version --client

      - name: Apply shared overlay
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" apply --kustomize ./gitops/nonprod/overlays/shared/ --force

      - name: Clean up credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${KUBECONFIG:-}" ]]; then
            rm -f -- "$KUBECONFIG"
          fi
          if [[ -n "${AZURE_CONFIG_DIR:-}" && -d "$AZURE_CONFIG_DIR" ]]; then
            az logout || true
            az account clear || true
            rm -rf -- "$AZURE_CONFIG_DIR"
          fi

  apply-environment-overlays:
    name: Apply ${{ matrix.overlay }} overlay
    needs:
      - check-repository
      - detect-changes
      - apply-shared
    timeout-minutes: 20
    if: >-
      ${{ always() && !cancelled() &&
          needs.check-repository.result == 'success' &&
          needs.detect-changes.result == 'success' &&
          (needs.apply-shared.result == 'success' || needs.apply-shared.result == 'skipped') &&
          needs.detect-changes.outputs.overlays != '[]' }}
    runs-on: arc-runners-dshp-dev
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        overlay: ${{ fromJSON(needs.detect-changes.outputs.overlays || '[]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch deployment credentials from HashiCorp Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          method: approle
          url: ${{ secrets.NONPROD_VAULT_URL }}
          roleId: ${{ secrets.NONPROD_VAULT_APPROLE_ROLE_ID }}
          secretId: ${{ secrets.NONPROD_VAULT_APPROLE_SECRET_ID }}
          exportEnv: false
          secrets: |
            canada-dental-care-plan/data/SPN SPN_ID | SPN_ID;
            canada-dental-care-plan/data/SPN SPN_PASSWORD | SPN_PASSWORD;

      - name: Authenticate to Azure and configure AKS access
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.NONPROD_AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          K8S_CLUSTER_NAME: ${{ vars.NONPROD_AKS_CLUSTER_NAME }}
          K8S_RESOURCE_GROUP: ${{ vars.NONPROD_AKS_RESOURCE_GROUP }}
          SP_ID: ${{ steps.vault.outputs.SPN_ID }}
          SP_PASSWORD: ${{ steps.vault.outputs.SPN_PASSWORD }}
        run: |
          set -euo pipefail

          umask 077
          azure_config_dir="$(mktemp -d "$RUNNER_TEMP/cdcp-azure.XXXXXX")"
          export AZURE_CONFIG_DIR="$azure_config_dir"
          printf 'AZURE_CONFIG_DIR=%s\n' "$AZURE_CONFIG_DIR" >> "$GITHUB_ENV"
          kubeconfig="$(mktemp "$RUNNER_TEMP/cdcp-nonprod-kubeconfig.XXXXXX")"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

          az login --service-principal \
            --tenant "$AZURE_TENANT_ID" \
            --username "$SP_ID" \
            --password "$SP_PASSWORD"

          az aks get-credentials --overwrite-existing \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$K8S_RESOURCE_GROUP" \
            --name "$K8S_CLUSTER_NAME" \
            --file "$kubeconfig"

          kubelogin convert-kubeconfig \
            --login spn \
            --client-id "$SP_ID" \
            --client-secret "$SP_PASSWORD" \
            --kubeconfig "$kubeconfig"

      - name: Print tool versions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == 'true' }}
        run: |
          set -euo pipefail
          printf 'GITHUB_EVENT_NAME=%s\nGITHUB_REF=%s\nGITHUB_SHA=%s\nGITHUB_RUN_ID=%s\nGITHUB_RUN_ATTEMPT=%s\nRUNNER_NAME=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          az version
          kubectl version --client

      - name: Apply environment overlay
        env:
          OVERLAY: ${{ matrix.overlay }}
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" apply --kustomize "./gitops/nonprod/overlays/${OVERLAY}/" --force

      - name: Clean up credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${KUBECONFIG:-}" ]]; then
            rm -f -- "$KUBECONFIG"
          fi
          if [[ -n "${AZURE_CONFIG_DIR:-}" && -d "$AZURE_CONFIG_DIR" ]]; then
            az logout || true
            az account clear || true
            rm -rf -- "$AZURE_CONFIG_DIR"
          fi
