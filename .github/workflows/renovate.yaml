# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Renovate

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect updates without creating branches, PRs, or dashboard issues
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

env:
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate versioning=semver
  RENOVATE_VERSION: 44.175.2

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  renovate:
    needs: check-repository
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          ((github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
           vars.RENOVATE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify App configuration
        env:
          APP_CLIENT_ID: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY must be available to this repository."
            exit 1
          fi

      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_IGNORE_SCRIPTS: 'true'
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'full' || 'null' }}
          LOG_LEVEL: debug
