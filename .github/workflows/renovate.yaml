# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Renovate

on:
  schedule:
    - cron: '*/15 7-16 * * 1-5'
      timezone: 'America/Toronto'
    # Cover Renovate's weekly lockfile-maintenance and runtime-update window.
    - cron: '17 0-3 * * 1'
      timezone: 'Etc/UTC'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect updates without creating branches, PRs, or dashboard issues
        type: boolean
        default: true
      debug:
        description: Enable Renovate debug logging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  renovate:
    needs: check-repository
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          ((github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
           vars.RENOVATE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read workspace tool constraints
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const node = /^>=(\d+\.\d+\.\d+)(?:\s|$)/.exec(manifest.engines?.node)?.[1];
          const pnpm = /^pnpm@(\d+\.\d+\.\d+)(?:\+|$)/.exec(manifest.packageManager)?.[1];
          if (!node || !pnpm) {
            throw new Error('Root package.json must declare a minimum Node.js version and an exact pnpm packageManager version.');
          }
          const constraints = { node, pnpm };
          appendFileSync(process.env.GITHUB_ENV, `RENOVATE_CONSTRAINTS=${JSON.stringify(constraints)}\n`);
          NODE

      - name: Verify App configuration
        env:
          APP_CLIENT_ID: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY must be available to this repository."
            exit 1
          fi

      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          # renovate: datasource=github-releases depName=renovatebot/renovate versioning=semver
          renovate-version: 44.175.2
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_IGNORE_SCRIPTS: 'true'
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_ALLOWED_COMMANDS: '["^pnpm install --recursive --include-workspace-root --frozen-lockfile --ignore-scripts$","^pnpm format:write$"]'
          # Workaround for Renovate + Docker Hub anonymous pagination 403 on deep tag pages (>1000 tags):
          # https://github.com/renovatebot/renovate/issues/46925
          # Keeps release timestamps available so minimumReleaseAge continues to work predictably.
          RENOVATE_DOCKER_MAX_PAGES: '10'
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'full' || 'null' }}
          LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.debug && 'debug' || 'info' }}
