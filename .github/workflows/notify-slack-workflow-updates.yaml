# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Posts queued messages and completion replies, also broadcast to the channel.
# Correlates messages by source-run metadata; missing parents produce standalone results.
# Explicitly subscribes to repository-owned workflows, excluding PR checks and this notifier.
# Keep the subscription list aligned with workflow names when adding or renaming workflows.
# Uses trusted default-branch helpers; fork sources are excluded and failures are non-blocking.

name: Post workflow updates to Slack

on:
  workflow_run:
    workflows:
      - Build, test, and publish nonprod images
      - Build, test, and publish nonprod tag images
      - Build, test, and publish PROD tag images
      - GitOps operator (nonprod)
      - GitOps operator (prod)
      - Nightly e2e tests
      - Upload PROD test results to SharePoint
    types: [requested, completed]

permissions: {}

env:
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  notify:
    needs: check-repository
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout trusted payload action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate Slack channel
        run: |
          if [[ -z "${SLACK_CHANNEL_ID//[[:space:]]/}" ]]; then
            echo "::error::SLACK_CHANNEL_ID is required."
            exit 1
          fi
          echo "Slack channel configuration is available."
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Prepare workflow notification
        id: message
        uses: ./.github/actions/prepare-slack-completion
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          github-token: ${{ github.token }}
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: Post workflow notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          payload: ${{ steps.message.outputs.payload }}
          token: ${{ secrets.SLACK_BOT_TOKEN }}
