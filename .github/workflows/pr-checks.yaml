# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Checks PRs targeting main or release branches. Frontend changes run validation,
# smoke tests, and container builds. Supports manual/reusable runs; no publishing.

name: Build and test pull request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Follows the principle of least privilege.
# Defaults to read-only repository contents for the GITHUB_TOKEN.
permissions:
  contents: read

# ----------------------------------------------------------------------------
# Triggers: When does this workflow run?
# ----------------------------------------------------------------------------
on:
  pull_request:
    # Triggers on PRs targeting the main branch or any release branch.
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    branches:
      - main
      - release/**
  # Allows this workflow to be called as a reusable workflow.
  workflow_call: {}
  # Allows a user to trigger this workflow manually from the GitHub Actions UI.
  workflow_dispatch: {}

env:
  # Standard environment variable letting tools know they are in CI.
  CI: true

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  detect-changes:
    runs-on: ubuntu-latest
    needs: check-repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect frontend changes
        id: frontend
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            src:
              - frontend/**
      - name: Detect GitOps changes
        id: gitops
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            src:
              - gitops/**
      - name: Detect infrastructure changes
        id: infrastructure
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            src:
              - infrastructure/**
    outputs:
      frontend-changed: ${{ steps.frontend.outputs.src }}
      gitops-changed: ${{ steps.gitops.outputs.src }}
      infrastructure-changed: ${{ steps.infrastructure.outputs.src }}

  test-frontend:
    runs-on: ubuntu-latest
    needs:
      - check-repository
      - detect-changes
    defaults:
      run:
        working-directory: ./frontend
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare --activate
      - name: Verify versions
        run: |
          node -v
          pnpm -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Check TypeScript types
        run: pnpm run typecheck
      - name: Run lint
        run: pnpm run lint:oxlint
      - name: Run unit tests with coverage
        id: vitest
        run: pnpm run test:unit:coverage --coverage.reportOnFailure
      - name: Upload Vitest coverage
        if: ${{ !cancelled() && needs.check-repository.result == 'success' && (steps.vitest.outcome == 'success' || steps.vitest.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: warn
          name: vitest-coverage-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/coverage/
          retention-days: 7
      - name: Build frontend
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Run end-to-end smoke tests
        id: e2e
        run: pnpm run test:e2e:smoke
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() && needs.check-repository.result == 'success' && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: warn
          name: playwright-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
  build-frontend:
    runs-on: ubuntu-latest
    needs:
      - check-repository
      - detect-changes
    defaults:
      run:
        working-directory: ./frontend
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Docker image
        run: podman build --file dockerfile .
