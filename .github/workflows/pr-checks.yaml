# ============================================================================
# Workflow: Build and test pull request
# Purpose:  This is the primary Continuous Integration (CI) pipeline. It
#           detects changes in the monorepo and selectively runs frontend
#           tests and container builds.
# Security: This workflow pins third-party GitHub Actions to immutable commit
#           SHAs rather than mutable version tags to help mitigate supply chain
#           attacks.
#
#           To find the exact 40-character SHA for a specific action release,
#           you can query the repository directly using git:
#           git ls-remote https://github.com/<owner>/<repo>.git refs/tags/<version>
#
#           Example:
#           git ls-remote https://github.com/actions/checkout.git refs/tags/v7.0.1
# ============================================================================
name: Build and test pull request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Follows the principle of least privilege.
# Defaults to read-only access for the GITHUB_TOKEN.
permissions: read-all

# ----------------------------------------------------------------------------
# Triggers: When does this workflow run?
# ----------------------------------------------------------------------------
on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    # Triggers on PRs targeting the main branch or any release branch.
    branches:
      - main
      - release/**
  # Allows this workflow to be called as a reusable workflow.
  workflow_call: {}
  # Allows a user to trigger this workflow manually from the GitHub Actions UI.
  workflow_dispatch: {}

env:
  # Standard environment variable letting tools know they are in CI.
  CI: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'STN-DTS/canadian-dental-care-plan' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect frontend changes
        id: frontend
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            src:
              - frontend/**
      - name: Detect GitOps changes
        id: gitops
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            src:
              - gitops/**
      - name: Detect infrastructure changes
        id: infrastructure
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            src:
              - infrastructure/**
    outputs:
      frontend-changed: ${{ steps.frontend.outputs.src }}
      gitops-changed: ${{ steps.gitops.outputs.src }}
      infrastructure-changed: ${{ steps.infrastructure.outputs.src }}

  test-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    defaults:
      run:
        working-directory: ./frontend
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare --activate
      - name: Verify versions
        run: |
          node -v
          pnpm -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Check TypeScript types
        run: pnpm run typecheck
      - name: Run lint
        run: pnpm run lint:oxlint
      - name: Run unit tests with coverage
        run: pnpm run test:unit:coverage
      - name: Build frontend
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Run end-to-end smoke tests
        run: pnpm run test:e2e:smoke
  build-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    defaults:
      run:
        working-directory: ./frontend
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: podman build --file dockerfile .
