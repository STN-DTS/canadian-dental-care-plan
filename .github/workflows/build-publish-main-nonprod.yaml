# ============================================================================
# Workflow: Build, test, and publish nonprod images
# Purpose:  Validates the frontend and publishes signed images to nonprod ACR.
# Security: Third-party GitHub Actions are pinned to immutable commit SHAs.
# ============================================================================
name: Build, test, and publish nonprod images

permissions: read-all

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false
  queue: max

on:
  push:
    branches:
      - main
      - release/v*
  workflow_call: {}
  workflow_dispatch:
    inputs:
      version:
        description: Version used in image metadata
        default: 0.0.0

env:
  CI: true
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  notify-start:
    continue-on-error: true
    needs: check-repository
    outputs:
      slack-ts: ${{ steps.slack.outputs.ts }}
    runs-on: arc-runners-dshp-dev
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout notification action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notify Slack of workflow start
        id: slack
        uses: ./.github/actions/notify-slack
        with:
          vault-url: ${{ secrets.VAULT_URL_NONPROD }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          status: started

  notify-complete:
    continue-on-error: true
    if: ${{ always() && needs.check-repository.result == 'success' }}
    needs:
      - check-repository
      - notify-start
      - detect-changes
      - resolve-version
      - test-frontend
      - build-frontend
    runs-on: arc-runners-dshp-dev
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BUILD_RESULTS: ${{ format('{0},{1},{2},{3}', needs.detect-changes.result, needs.resolve-version.result, needs.test-frontend.result, needs.build-frontend.result) }}
    steps:
      - name: Checkout notification action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notify Slack of workflow result
        uses: ./.github/actions/notify-slack
        with:
          vault-url: ${{ secrets.VAULT_URL_NONPROD }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.notify-start.outputs.slack-ts }}
          job-results: ${{ toJSON(needs) }}
          image-ref: ${{ needs.build-frontend.outputs.published-image-ref }}
          status: ${{ contains(env.BUILD_RESULTS, 'failure') && 'failure' || contains(env.BUILD_RESULTS, 'cancelled') && 'cancelled' || needs.build-frontend.result == 'success' && 'success' || 'skipped' }}
          message: >-
            ${{ needs.build-frontend.outputs.pushed-image-tags != '' && format('Pushed image tags:{0}{1}', fromJSON('"\n"'), needs.build-frontend.outputs.pushed-image-tags) || '' }}

  detect-changes:
    runs-on: ubuntu-latest
    needs: check-repository
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout source code
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for frontend changes
        if: ${{ github.event_name == 'push' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - .github/workflows/build-publish-main-nonprod.yaml
              - .github/actions/**
              - frontend/**
      - name: Publish change-detection output
        id: changes
        run: |
          echo "frontend=${{ github.event_name != 'push' || steps.filter.outputs.frontend == 'true' }}" >> "$GITHUB_OUTPUT"

  resolve-version:
    needs: check-repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate build version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$REF_NAME" == release/* ]]; then
            version=${REF_NAME#release/v}
          else
            version=${INPUT_VERSION:-0.0.0}
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid version; expected X.Y.Z with an optional hyphenated suffix containing only letters, numbers, dots, or hyphens." >&2
            exit 1
          fi

          build_number=$(printf '%05x' "$RUN_NUMBER")
          rc_label=$(printf '%03d' "$RUN_NUMBER")
          short_sha=${SOURCE_SHA:0:8}
          main_tag="${version}-${short_sha}-${build_number}"
          release_tag="${version}-RC${rc_label}-${short_sha}"
          if (( ${#main_tag} > 128 || ${#release_tag} > 128 )); then
            echo "Version is too long; generated Docker tags must not exceed 128 characters." >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  test-frontend:
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' }}
    needs:
      - check-repository
      - detect-changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run format check
        run: pnpm run format:check
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Run lint
        run: pnpm run lint:oxlint
      - name: Run unit tests with coverage
        run: pnpm run test:unit:coverage
      - name: Build frontend
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Run end-to-end tests
        id: e2e
        run: ${{ github.ref == 'refs/heads/main' && 'pnpm run test:e2e:smoke' || 'pnpm run test:e2e' }}
      - name: Upload E2E failure artifacts
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  build-frontend:
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v')) }}
    runs-on: arc-runners-dshp-dev
    needs:
      - check-repository
      - detect-changes
      - resolve-version
      - test-frontend
    outputs:
      pushed-image-tags: ${{ steps.pushed-tags.outputs.image-tags }}
      published-image-ref: ${{ steps.push.outputs.image-digest != '' && format('{0}/canada-dental-care-plan/canada-dental-care-plan-frontend@{1}', vars.ACR_DOMAIN_NONPROD, steps.push.outputs.image-digest) || '' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify image signing configuration
        run: |
          set -euo pipefail
          test -s .github/actions/sign-container-image/cosign.pub
      - name: Authenticate to Azure and setup ACR credentials
        id: acr-login
        uses: ./.github/actions/azure-acr-login
        with:
          vault-url: ${{ secrets.VAULT_URL_NONPROD }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
          azure-tenant-id: ${{ vars.ENTRA_ID_TENANT_NONPROD }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_NONPROD }}
          acr-domain: ${{ vars.ACR_DOMAIN_NONPROD }}
      - name: Generate dynamic build variables
        id: build-vars
        uses: ./.github/actions/generate-build-vars
        with:
          version: ${{ needs.resolve-version.outputs.version }}
      - name: Build frontend OCI image
        env:
          BUILD_DATE: ${{ steps.build-vars.outputs.build-date }}
          BUILD_NUMBER: ${{ steps.build-vars.outputs.build-number }}
          BUILD_REVISION: ${{ steps.build-vars.outputs.build-revision }}
          BUILD_VERSION: ${{ steps.build-vars.outputs.build-version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ vars.ACR_DOMAIN_NONPROD }}/canada-dental-care-plan/canada-dental-care-plan-frontend
        run: |
          set -euo pipefail

          short_sha="${SOURCE_SHA:0:8}"
          docker build \
            --file frontend/dockerfile frontend \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg BUILD_ID="$BUILD_NUMBER" \
            --build-arg BUILD_REVISION="$short_sha" \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --tag "$IMAGE_NAME:$BUILD_REVISION"

          if [[ "$REF_NAME" == main ]]; then
            docker tag "$IMAGE_NAME:$BUILD_REVISION" "$IMAGE_NAME:$BUILD_VERSION-$short_sha"
            docker tag "$IMAGE_NAME:$BUILD_REVISION" "$IMAGE_NAME:$BUILD_VERSION-$short_sha-$BUILD_NUMBER"
          elif [[ "$REF_NAME" == release/* ]]; then
            rc_label=$(printf '%03d' "$RUN_NUMBER")
            docker tag "$IMAGE_NAME:$BUILD_REVISION" "$IMAGE_NAME:$BUILD_VERSION-RC$rc_label-$short_sha"
          fi
      - name: Scan frontend OCI image
        uses: ./.github/actions/aqua-scan
        with:
          image-ref: ${{ vars.ACR_DOMAIN_NONPROD }}/canada-dental-care-plan/canada-dental-care-plan-frontend:${{ steps.build-vars.outputs.build-revision }}
          artifact-prefix: cdcp-frontend
          vault-url: ${{ secrets.VAULT_URL_NONPROD }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
          scan-timestamp: ${{ steps.build-vars.outputs.scan-timestamp }}
      - name: Push frontend OCI image to registry
        id: push
        env:
          BUILD_REVISION: ${{ steps.build-vars.outputs.build-revision }}
          BUILD_VERSION: ${{ steps.build-vars.outputs.build-version }}
          BUILD_NUMBER: ${{ steps.build-vars.outputs.build-number }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ vars.ACR_DOMAIN_NONPROD }}/canada-dental-care-plan/canada-dental-care-plan-frontend
        run: |
          set -euo pipefail

          pushed_image_tags_file="$(mktemp "$RUNNER_TEMP/pushed-image-tags.XXXXXX")"
          printf 'PUSHED_IMAGE_TAGS_FILE=%s\n' "$pushed_image_tags_file" >> "$GITHUB_ENV"
          push_log="$(mktemp "$RUNNER_TEMP/image-push.XXXXXX")"
          trap 'rm -f "$push_log"' EXIT
          image_ref="${IMAGE_NAME}:${BUILD_REVISION}"

          {
            echo "## Published container tags"
            echo
            echo "| Application | Tag | Image | Source commit |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          push_image() {
            local image_ref="$1"
            docker push "$image_ref" 2>&1 | tee "$push_log"
            printf '%s\n' "$image_ref" >> "$pushed_image_tags_file"
            printf '| CDCP frontend | `%s` | `%s` | [`%s`](%s/%s/commit/%s) |\n' \
              "${image_ref##*:}" "$image_ref" "${GITHUB_SHA:0:8}" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          }

          push_image "$image_ref"
          image_digest="$(awk '/digest: sha256:/ { for (i = 1; i < NF; i++) if ($i == "digest:") { print $(i + 1); exit } }' "$push_log")"
          short_sha="${SOURCE_SHA:0:8}"
          if [[ "$REF_NAME" == main ]]; then
            push_image "${IMAGE_NAME}:${BUILD_VERSION}-${short_sha}"
          elif [[ "$REF_NAME" == release/* ]]; then
            rc_label=$(printf '%03d' "$RUN_NUMBER")
            push_image "${IMAGE_NAME}:${BUILD_VERSION}-RC${rc_label}-${short_sha}"
          fi

          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unable to determine the pushed frontend image digest." >&2
            exit 1
          fi

          printf 'image-digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"
          printf '\nImage digest: `%s`\n' "$image_digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign and verify frontend OCI image
        uses: ./.github/actions/sign-container-image
        with:
          image: ${{ vars.ACR_DOMAIN_NONPROD }}/canada-dental-care-plan/canada-dental-care-plan-frontend@${{ steps.push.outputs.image-digest }}
          vault-url: ${{ secrets.VAULT_URL_NONPROD }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
      - name: Promote verified frontend image to latest
        if: ${{ success() && github.ref_name == 'main' }}
        env:
          BUILD_REVISION: ${{ steps.build-vars.outputs.build-revision }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image-digest }}
          IMAGE_NAME: ${{ vars.ACR_DOMAIN_NONPROD }}/canada-dental-care-plan/canada-dental-care-plan-frontend
        run: |
          set -euo pipefail

          docker tag "${IMAGE_NAME}:${BUILD_REVISION}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          printf '%s\n' "${IMAGE_NAME}:latest" >> "$PUSHED_IMAGE_TAGS_FILE"

          {
            echo "## Promoted verified container tag"
            echo
            echo "| Application | Tag | Image | Source commit |"
            echo "| --- | --- | --- | --- |"
            printf '| CDCP frontend | `latest` | `%s:latest` | [`%s`](%s/%s/commit/%s) |\n' \
              "$IMAGE_NAME" "${GITHUB_SHA:0:8}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '\nVerified image digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Promote verified frontend release aliases
        if: ${{ success() && startsWith(github.ref, 'refs/heads/release/v') }}
        env:
          BUILD_REVISION: ${{ steps.build-vars.outputs.build-revision }}
          BUILD_VERSION: ${{ steps.build-vars.outputs.build-version }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image-digest }}
          IMAGE_NAME: ${{ vars.ACR_DOMAIN_NONPROD }}/canada-dental-care-plan/canada-dental-care-plan-frontend
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          rc_label=$(printf '%03d' "$RUN_NUMBER")
          {
            echo "## Promoted verified release tags"
            echo
            echo "| Application | Tag | Image | Source commit |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for image_tag in "${BUILD_VERSION}-RC${rc_label}" "${BUILD_VERSION}-RC"; do
            image_ref="${IMAGE_NAME}:${image_tag}"
            docker tag "${IMAGE_NAME}:${BUILD_REVISION}" "$image_ref"
            docker push "$image_ref"
            printf '%s\n' "$image_ref" >> "$PUSHED_IMAGE_TAGS_FILE"
            printf '| CDCP frontend | `%s` | `%s` | [`%s`](%s/%s/commit/%s) |\n' \
              "$image_tag" "$image_ref" "${GITHUB_SHA:0:8}" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '\nVerified image digest: `%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Restart dev and int1 deployments
        if: ${{ github.ref_name == 'main' }}
        env:
          AZURE_CLIENT_ID: ${{ steps.acr-login.outputs.azure-client-id }}
          AZURE_CLIENT_SECRET: ${{ steps.acr-login.outputs.azure-client-secret }}
          K8S_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NONPROD }}
          K8S_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP_NONPROD }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_NONPROD }}
        run: |
          set -euo pipefail

          umask 077
          kubeconfig="$(mktemp "$RUNNER_TEMP/cdcp-nonprod-kubeconfig.XXXXXX")"
          trap 'rm -f "$kubeconfig"' EXIT
          az aks get-credentials --overwrite-existing \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$K8S_RESOURCE_GROUP" \
            --name "$K8S_CLUSTER_NAME" \
            --file "$kubeconfig"
          kubelogin convert-kubeconfig \
            --login spn \
            --kubeconfig "$kubeconfig"

          kubectl rollout restart deployment/frontend-dev \
            --kubeconfig "$kubeconfig" --namespace canada-dental-care-plan
          kubectl rollout restart deployment/frontend-int1 \
            --kubeconfig "$kubeconfig" --namespace canada-dental-care-plan
      - name: Clean up Azure and registry credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${AZURE_CONFIG_DIR:-}" ]]; then
            rm -rf -- "$AZURE_CONFIG_DIR"
          fi
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
      - name: Collect pushed image tags
        id: pushed-tags
        if: ${{ always() }}
        run: |
          set -euo pipefail

          if [[ -f "${PUSHED_IMAGE_TAGS_FILE:-}" ]]; then
            output_delimiter="image_tags_$(cat /proc/sys/kernel/random/uuid)"
            {
              printf 'image-tags<<%s\n' "$output_delimiter"
              while IFS= read -r image_ref; do
                printf -- '- %s\n' "$image_ref"
              done < "$PUSHED_IMAGE_TAGS_FILE"
              printf '%s\n' "$output_delimiter"
            } >> "$GITHUB_OUTPUT"
            rm -f -- "$PUSHED_IMAGE_TAGS_FILE"
          else
            printf 'image-tags=\n' >> "$GITHUB_OUTPUT"
          fi
