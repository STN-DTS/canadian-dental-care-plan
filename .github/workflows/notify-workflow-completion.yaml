# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Posts a Slack summary for every completion result of the selected workflows.
# Uses a trusted local payload action and originating-run metadata without downloading artifacts.
name: Notify workflow completions

on:
  workflow_run:
    workflows:
      - Build, test, and publish nonprod images
      - Build, test, and publish nonprod tag images
      - Build, test, and publish PROD tag images
      - Nightly e2e tests
    types: [completed]

permissions: {}

env:
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  notify:
    needs: check-repository
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: arc-runners-dshp-dev
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout trusted payload action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate Slack channel
        run: |
          if [[ -z "${SLACK_CHANNEL_ID//[[:space:]]/}" ]]; then
            echo "::error::SLACK_CHANNEL_ID is required."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Prepare completion message
        id: message
        uses: ./.github/actions/prepare-slack-completion
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          github-token: ${{ github.token }}
      - name: Fetch Slack bot token
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          method: approle
          url: ${{ secrets.VAULT_URL_NONPROD }}
          roleId: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          secretId: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
          exportEnv: false
          exportToken: false
          secrets: |
            canada-dental-care-plan/data/shared/cicd/slack SLACK_BOT_TOKEN | SLACK_BOT_TOKEN;
      - name: Post completion notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ steps.vault.outputs.SLACK_BOT_TOKEN }}
          errors: true
          payload: ${{ steps.message.outputs.payload }}
