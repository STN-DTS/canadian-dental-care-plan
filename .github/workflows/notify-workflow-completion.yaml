# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Posts Slack results for all workflow completions, including failures and cancellations.
# Ordered name patterns include ** first, then exclude PR checks and this notifier.
# Keep quoted exclusions aligned with workflow names when renaming workflows.
# Uses trusted default-branch helpers; fork sources are excluded and failures are non-blocking.

name: Notify workflow completions

on:
  workflow_run:
    workflows:
      - "**"
      - "!Build and test pull request"
      - "!Notify workflow completions"
    types: [completed]

permissions: {}

env:
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  notify:
    needs: check-repository
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: arc-runners-dshp-dev
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout trusted payload action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate Slack channel
        run: |
          if [[ -z "${SLACK_CHANNEL_ID//[[:space:]]/}" ]]; then
            echo "::error::SLACK_CHANNEL_ID is required."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Prepare completion message
        id: message
        uses: ./.github/actions/prepare-slack-completion
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          github-token: ${{ github.token }}
      - name: Fetch Slack bot token
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          exportEnv: false
          exportToken: false
          method: approle
          roleId: ${{ secrets.NONPROD_VAULT_APPROLE_ROLE_ID }}
          secretId: ${{ secrets.NONPROD_VAULT_APPROLE_SECRET_ID }}
          secrets: |
            canada-dental-care-plan/data/shared/cicd/slack SLACK_BOT_TOKEN | SLACK_BOT_TOKEN;
          url: ${{ secrets.NONPROD_VAULT_URL }}
      - name: Post completion notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          payload: ${{ steps.message.outputs.payload }}
          token: ${{ steps.vault.outputs.SLACK_BOT_TOKEN }}
