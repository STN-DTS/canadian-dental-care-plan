name: Notify workflow runs

on:
  workflow_run:
    workflows:
      - Build, test, and publish nonprod images
      - Build, test, and publish nonprod tag images
      - Nightly e2e tests
    types: [requested, in_progress, completed]

permissions: {}

env:
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  notify:
    needs: check-repository
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: arc-runners-dshp-dev
    timeout-minutes: 5
    continue-on-error: true
    concurrency:
      group: slack-${{ github.repository }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted notification action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Ensure Node.js runtime libraries
        run: |
          set -euo pipefail

          if ! ldconfig -p | grep -F 'libatomic.so.1' >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install --yes libatomic1
          fi
      - name: Setup Node.js for workflow metadata
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Ensure state archive reader
        run: |
          set -euo pipefail
          if ! command -v unzip >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install --yes unzip
          fi
      - name: Restore Slack message state
        id: state
        env:
          NOTIFICATION_STATE_MODE: restore
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/actions/notify-slack/workflow-message-state.mjs
      - name: Read failed jobs from the originating run attempt
        if: ${{ steps.state.outputs.should-post == 'true' }}
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/actions/notify-slack/prepare-workflow-run.mjs
      - name: Post workflow notification
        id: slack
        if: ${{ steps.state.outputs.should-post == 'true' }}
        uses: ./.github/actions/notify-slack
        with:
          vault-url: ${{ secrets.VAULT_URL_NONPROD }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          status: ${{ github.event.action == 'requested' && 'queued' || github.event.action == 'in_progress' && 'started' || github.event.workflow_run.conclusion }}
          message-ts: ${{ steps.state.outputs.message-ts }}
          workflow-name: ${{ github.event.workflow_run.name }}
          run-url: ${{ github.event.workflow_run.html_url }}
          ref: ${{ github.event.workflow_run.head_branch }}
          commit-sha: ${{ github.event.workflow_run.head_sha }}
          actor: ${{ github.event.workflow_run.triggering_actor.login || github.event.workflow_run.actor.login }}
          event-name: ${{ github.event.workflow_run.event }}
          run-number: ${{ github.event.workflow_run.run_number }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
          job-results: ${{ steps.metadata.outputs.job-results }}
      - name: Persist Slack message state
        if: ${{ steps.slack.outcome == 'success' }}
        env:
          NOTIFICATION_STATE_MODE: save
          REPOSITORY: ${{ github.repository }}
          MESSAGE_TS: ${{ steps.slack.outputs.ts || steps.state.outputs.message-ts }}
        run: node .github/actions/notify-slack/workflow-message-state.mjs
      - name: Upload Slack message state
        if: ${{ steps.slack.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.state.outputs.artifact-name }}
          path: ${{ steps.state.outputs.state-file }}
          retention-days: 7
          if-no-files-found: error
