name: Nightly e2e tests

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

env:
  CI: true
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}

permissions: read-all

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  notify-start:
    continue-on-error: true
    needs: check-repository
    runs-on: arc-runners-dshp-dev
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout notification action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notify Slack of E2E start
        uses: ./.github/actions/notify-slack
        with:
          vault-url: ${{ secrets.VAULT_URL_NONPROD }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          status: started

  notify-complete:
    continue-on-error: true
    if: ${{ always() && needs.check-repository.result == 'success' }}
    needs:
      - check-repository
      - notify-start
      - run-e2e-tests
    runs-on: arc-runners-dshp-dev
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout notification action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notify Slack of E2E result
        uses: ./.github/actions/notify-slack
        with:
          vault-url: ${{ secrets.VAULT_URL_NONPROD }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID_NONPROD }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID_NONPROD }}
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          status: ${{ needs.run-e2e-tests.result }}

  run-e2e-tests:
    needs: check-repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare --activate
        working-directory: frontend/
      - name: Verify versions
        run: |
          node -v
          pnpm -v
        working-directory: frontend/
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/
      - name: Build frontend
        run: pnpm run build
        working-directory: frontend/
      - name: Install Playwright dependencies
        run: pnpm exec playwright install chromium --with-deps
        working-directory: frontend/
      - name: Run e2e tests
        id: e2e
        run: pnpm run test:e2e
        working-directory: frontend/
      - name: Upload E2E failure artifacts
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
