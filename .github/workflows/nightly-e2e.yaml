# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Builds the frontend and runs Chromium end-to-end tests at 00:00 UTC daily
# or on manual dispatch. Publishes Playwright reports for completed test runs.

name: Nightly e2e tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

env:
  CI: true

permissions:
  contents: read

jobs:
  check-repository:
    if: ${{ github.event.repository.fork != true }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow non-fork repository
        run: echo "Repository check passed."

  run-e2e-tests:
    needs: check-repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare --activate
      - name: Verify versions
        run: |
          node -v
          pnpm -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter @cdcp-rcsd/frontend run build
      - name: Install Playwright dependencies
        run: pnpm --filter @cdcp-rcsd/frontend exec playwright install chromium --with-deps
      - name: Run e2e tests
        id: e2e
        run: pnpm --filter @cdcp-rcsd/frontend run test:e2e
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() && needs.check-repository.result == 'success' && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: warn
          name: playwright-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
