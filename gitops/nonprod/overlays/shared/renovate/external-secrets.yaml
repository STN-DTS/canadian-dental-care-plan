apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-app
  labels:
    app.kubernetes.io/name: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  data:
    - secretKey: client-id
      remoteRef:
        key: shared/cicd/renovate
        property: RENOVATE_APP_CLIENT_ID
    - secretKey: private-key.pem
      remoteRef:
        key: shared/cicd/renovate
        property: RENOVATE_APP_PRIVATE_KEY
