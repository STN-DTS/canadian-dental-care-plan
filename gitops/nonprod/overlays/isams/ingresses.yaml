apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 32k # required for OAuth proxy
  labels:
    app.kubernetes.io/name: frontend
spec:
  ingressClassName: nginx
  tls:
    # TLS secret `devdpdtsstncom` is provisioned out-of-band by the dev cluster
    # platform and is not managed in this repo. Confirm it covers this host.
    - secretName: devdpdtsstncom
      hosts:
        - cdcp-isams.dev-dp.dts-stn.com
  rules:
    # All traffic, including the iSAMS callback, passes through the OAuth proxy.
    # Unlike int1, there is no internal host that bypasses it.
    - host: cdcp-isams.dev-dp.dts-stn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: oauth-proxy
