apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  annotations:
    # reload the pod whenever the secrets change
    secret.reloader.stakater.com/auto: 'true'
spec:
  replicas: 3
  serviceName: redis-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    #
    # pin all versions to v8.8
    #
    spec:
      initContainers:
        - name: init
          image: docker.io/redis:8.8@sha256:418e397fd48d66e450af13baab123397f2d2580b07ef310c3a5dbe96c3d731f1
      containers:
        - name: redis
          image: docker.io/redis:8.8@sha256:418e397fd48d66e450af13baab123397f2d2580b07ef310c3a5dbe96c3d731f1
        - name: redis-sentinel
          image: docker.io/redis:8.8@sha256:418e397fd48d66e450af13baab123397f2d2580b07ef310c3a5dbe96c3d731f1
