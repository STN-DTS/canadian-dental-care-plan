apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  annotations:
    # reload the pod whenever the secrets change
    secret.reloader.stakater.com/auto: 'true'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      annotations:
        container.inject.dynatrace.com/oauth-proxy: 'false'
    spec:
      containers:
        - name: canada-dental-care-plan-frontend
          volumeMounts:
            - mountPath: /app/logs
              $patch: delete
            - name: audit-logs
              mountPath: /home/node/logs
          image: dtsrhpdevscedacr.azurecr.io/canada-dental-care-plan/canada-dental-care-plan-frontend:7.3.3
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: frontend
            - secretRef:
                name: frontend
            - secretRef:
                name: redis
        - name: oauth-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          args:
            - --config=/etc/oauth-proxy.conf
          envFrom:
            - secretRef:
                name: oauth-proxy
          ports:
            - name: oauth-proxy
              containerPort: 4180
          livenessProbe:
            httpGet:
              path: /ping
              port: oauth-proxy
            initialDelaySeconds: 0
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /ping
              port: oauth-proxy
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: oauth-proxy-conf
              mountPath: /etc/oauth-proxy.conf
              subPath: config.conf
        - name: fluentd
          image: docker.io/fluentd:v1.19.4-debian-1.0@sha256:fb4e1deac4edad76800a2106a83dedbb36b4b5595062675b8e7076f21ccc26e6
          args: [--config, /etc/fluentd.conf]
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi
          volumeMounts:
            - name: audit-logs
              mountPath: /logs
            - name: fluentd-conf
              mountPath: /etc/fluentd.conf
              subPath: fluentd.conf
      volumes:
        - name: fluentd-conf
          configMap:
            name: frontend-fluentd
        - name: oauth-proxy-conf
          configMap:
            name: oauth-proxy
