apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canada-dental-care-plan
nameSuffix: -uat1
labels:
  - pairs:
      app.kubernetes.io/instance: uat1
    includeSelectors: true
  - pairs:
      app.kubernetes.io/part-of: canada-dental-care-plan
      app.kubernetes.io/managed-by: teamcity
      app.kubernetes.io/cluster: dts-dev-sced-rhp-spoke-aks
      app.kubernetes.io/environment: uat1
      app.kubernetes.io/tier: nonprod
resources:
  - ../../base/frontend/
  - ../../base/maintenance/
  - ../../base/redis/
  - ./external-secrets.yaml
  #
  # Note: to enable maintenance mode:
  #
  #   1. comment ./ingresses.yaml
  #   2. uncomment ./ingresses-maintenance.yaml
  #
  - ./ingresses.yaml
  # - ./ingresses-maintenance.yaml
  # Uncomment if we want to enable letters maintenance
  # - ./ingresses-letters-maintenance.yaml
patches:
  - path: ./patches/deployments.yaml
  - path: ./patches/deployments-maintenance.yaml
  - path: ./patches/services.yaml
configMapGenerator:
  - name: frontend
    behavior: merge
    envs:
      - ./configs/frontend/config.conf
  - name: redis
    behavior: merge
    files:
      - ./configs/redis/replica.conf
      - ./configs/redis/sentinel.conf
  - name: oauth-proxy
    behavior: create
    files:
      - ./configs/oauth-proxy/config.conf
  - name: maintenance
    behavior: merge
    # TODO :: Remove when letters maintenance is no longer enabled
    # files:
    #   - ./configs/maintenance/503.html
    literals:
      - startTimeEn=April 14, 2026, at 8:00 p.m.
      - startTimeFr=14 avril 2026 à 20 h 00
      - endTimeEn=April 15, 2026, at 8:00 a.m. (EST)
      - endTimeFr=15 avril 2026 à 08 h 00 (HNE)
