apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: maintenance
  template:
    spec:
      initContainers:
        - name: preprocess-html
          image: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.9@sha256:84f7876d21d154885f99554d7ae325d8c2213f9169726ea7ab60642f2573a787
