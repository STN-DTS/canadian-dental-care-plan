apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluentd-archiver
  labels:
    app.kubernetes.io/name: fluentd-archiver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd-archiver
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentd-archiver
    spec:
      containers:
        - name: fluentd-archiver
          image: docker.io/fluentd:v1.19.4-debian-1.0@sha256:af10e6840bada3ad158e1bc7dd05859b9a06ed0b89ecfe91877e2c9f9162fefb
          args: [--config, /etc/fluentd.conf]
          ports:
            - name: fluentd
              containerPort: 24224
          volumeMounts:
            - name: audit-logs
              mountPath: /logs
            - name: fluentd-conf
              mountPath: /etc/fluentd.conf
              subPath: fluentd.conf
      securityContext:
        fsGroup: 101 # `fluent` gid
      volumes:
        - name: audit-logs
          persistentVolumeClaim:
            claimName: audit-logs
        - name: fluentd-conf
          configMap:
            name: fluentd-archiver
