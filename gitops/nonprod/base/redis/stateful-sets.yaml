apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  annotations:
    # reload the pod whenever the secrets change
    secret.reloader.stakater.com/auto: 'true'
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  serviceName: redis-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      initContainers:
        - name: init
          image: docker.io/redis:8.10.3-trixie@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
          command: [bash, /etc/init.sh]
          envFrom:
            - secretRef:
                name: redis
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/init.sh
              subPath: init.sh
            - name: config
              mountPath: /etc/primary.conf
              subPath: primary.conf
            - name: config
              mountPath: /etc/replica.conf
              subPath: replica.conf
            - name: config
              mountPath: /etc/sentinel.conf
              subPath: sentinel.conf
      containers:
        - name: redis
          image: docker.io/redis:8.10.3-trixie@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
          command: [bash, /etc/start-redis.sh]
          args: [/data/redis.conf, --requirepass, $(REDIS_PASSWORD), --masterauth, $(REDIS_PASSWORD)]
          envFrom:
            - secretRef:
                name: redis
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: [/usr/local/bin/redis-cli, --pass, $(REDIS_PASSWORD), ping]
            initialDelaySeconds: 10
          readinessProbe:
            exec:
              command: [/usr/local/bin/redis-cli, --pass, $(REDIS_PASSWORD), ping]
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/start-redis.sh
              subPath: start-redis.sh
            - name: data
              mountPath: /data
        - name: redis-sentinel
          image: docker.io/redis:8.10.3-trixie@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
          args: [/data/sentinel.conf, --sentinel]
          ports:
            - name: sentinel
              containerPort: 26379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: redis
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2048Mi
