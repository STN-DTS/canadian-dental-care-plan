apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canada-dental-care-plan
resources:
  - ./services.yaml
  - ./stateful-sets.yaml
configMapGenerator:
  - name: redis
    files:
      - ./configs/init.sh
      - ./configs/prestop-redis.sh
      - ./configs/prestop-sentinel.sh
      - ./configs/primary.conf
      - ./configs/replica.conf
      - ./configs/sentinel.conf
      - ./configs/start-redis.sh
