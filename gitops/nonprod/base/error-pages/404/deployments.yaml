apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-404
  labels:
    app.kubernetes.io/name: error-404
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: error-404
  template:
    metadata:
      labels:
        app.kubernetes.io/name: error-404
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.8@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: error-404-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: config.conf
            - name: error-404-conf
              mountPath: /usr/share/nginx/html/404.html
              subPath: 404.html
      volumes:
        - name: error-404-conf
          configMap:
            name: error-404
