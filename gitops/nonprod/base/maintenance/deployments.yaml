apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
  labels:
    app.kubernetes.io/name: maintenance
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: maintenance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintenance
    spec:
      initContainers:
        - name: preprocess-html
          image: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command: ['/bin/sh', '-c']
          args:
            - |
              cp /tmp/original/503.html /tmp/processed/503.html
              sed --in-place "s|{{startTimeEn}}|$(cat /tmp/original/startTimeEn)|g" /tmp/processed/503.html
              sed --in-place "s|{{startTimeFr}}|$(cat /tmp/original/startTimeFr)|g" /tmp/processed/503.html
              sed --in-place "s|{{endTimeEn}}|$(cat /tmp/original/endTimeEn)|g"     /tmp/processed/503.html
              sed --in-place "s|{{endTimeFr}}|$(cat /tmp/original/endTimeFr)|g"     /tmp/processed/503.html
          volumeMounts:
            - name: maintenance-conf
              mountPath: /tmp/original
            - name: processed-html
              mountPath: /tmp/processed
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.8@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: maintenance-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: config.conf
            - name: processed-html
              mountPath: /usr/share/nginx/html/503.html
              subPath: 503.html
      volumes:
        - name: maintenance-conf
          configMap:
            name: maintenance
        - name: processed-html
          emptyDir: {}
