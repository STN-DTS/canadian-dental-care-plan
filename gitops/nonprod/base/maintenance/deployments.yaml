apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
  labels:
    app.kubernetes.io/name: maintenance
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: maintenance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintenance
    spec:
      initContainers:
        - name: preprocess-html
          image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ['/bin/sh', '-c']
          args:
            - |
              cp /tmp/original/503.html /tmp/processed/503.html
              sed --in-place "s|{{startTimeEn}}|$(cat /tmp/original/startTimeEn)|g" /tmp/processed/503.html
              sed --in-place "s|{{startTimeFr}}|$(cat /tmp/original/startTimeFr)|g" /tmp/processed/503.html
              sed --in-place "s|{{endTimeEn}}|$(cat /tmp/original/endTimeEn)|g"     /tmp/processed/503.html
              sed --in-place "s|{{endTimeFr}}|$(cat /tmp/original/endTimeFr)|g"     /tmp/processed/503.html
          volumeMounts:
            - name: maintenance-conf
              mountPath: /tmp/original
            - name: processed-html
              mountPath: /tmp/processed
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.8@sha256:6e67f8eaac94fc456588d4ff6c470d984841f5b5dc4279863d5cbe6ec5a60def
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: maintenance-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: config.conf
            - name: processed-html
              mountPath: /usr/share/nginx/html/503.html
              subPath: 503.html
      volumes:
        - name: maintenance-conf
          configMap:
            name: maintenance
        - name: processed-html
          emptyDir: {}
