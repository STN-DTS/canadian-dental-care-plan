apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
  labels:
    app.kubernetes.io/name: maintenance
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: maintenance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintenance
    spec:
      initContainers:
        - name: preprocess-html
          image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command: ['/bin/sh', '-c']
          args:
            - |
              cp /tmp/original/503.html /tmp/processed/503.html
              sed --in-place "s|{{startTimeEn}}|$(cat /tmp/original/startTimeEn)|g" /tmp/processed/503.html
              sed --in-place "s|{{startTimeFr}}|$(cat /tmp/original/startTimeFr)|g" /tmp/processed/503.html
              sed --in-place "s|{{endTimeEn}}|$(cat /tmp/original/endTimeEn)|g"     /tmp/processed/503.html
              sed --in-place "s|{{endTimeFr}}|$(cat /tmp/original/endTimeFr)|g"     /tmp/processed/503.html
          volumeMounts:
            - name: maintenance-conf
              mountPath: /tmp/original
            - name: processed-html
              mountPath: /tmp/processed
      containers:
        - name: nginx
          image: docker.io/nginx:1.31.6@sha256:60f0d4e986561e08804f75c211dcaf7fc5455699eada29f42cbe8a0a7253dd86
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: maintenance-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: config.conf
            - name: processed-html
              mountPath: /usr/share/nginx/html/503.html
              subPath: 503.html
      volumes:
        - name: maintenance-conf
          configMap:
            name: maintenance
        - name: processed-html
          emptyDir: {}
