apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid-proxy
  labels:
    app.kubernetes.io/name: squid-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: squid-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squid-proxy
    spec:
      containers:
        - name: squid-proxy
          # Canonical publishes versioned Squid images as _edge; use the Ubuntu 24.04 LTS variant.
          image: docker.io/ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
          ports:
            - name: squid
              containerPort: 3128
          livenessProbe:
            exec:
              command: [/usr/sbin/squid, -k, parse]
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [/usr/sbin/squid, -k, parse]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
