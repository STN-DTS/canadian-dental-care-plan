apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: error-404
  name: error-404
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: error-404
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: fluentd-archiver
  name: fluentd-archiver
spec:
  ports:
    - name: fluentd
      port: 24224
      targetPort: fluentd
  selector:
    app.kubernetes.io/name: fluentd-archiver
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: frontend
  name: frontend
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: oauth-proxy
      port: 81
      targetPort: oauth-proxy
  selector:
    app.kubernetes.io/name: frontend
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: maintenance
  name: maintenance
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: maintenance
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: redis
  name: redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: redis-headless
  name: redis-headless
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
  selector:
    app.kubernetes.io/name: redis
