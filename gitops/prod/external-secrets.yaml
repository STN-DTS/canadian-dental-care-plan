apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: frontend
  name: frontend
spec:
  data:
    - remoteRef:
        key: cdcp-prod
        property: AUTH_JWT_PRIVATE_KEY
      secretKey: AUTH_JWT_PRIVATE_KEY
    - remoteRef:
        key: cdcp-prod
        property: AUTH_JWT_PUBLIC_KEY
      secretKey: AUTH_JWT_PUBLIC_KEY
    - remoteRef:
        key: cdcp-prod
        property: DYNATRACE_API_RUM_SCRIPT_TOKEN
      secretKey: DYNATRACE_API_RUM_SCRIPT_TOKEN
    - remoteRef:
        key: cdcp-prod
        property: GC_NOTIFY_API_KEY
      secretKey: GC_NOTIFY_API_KEY
    - remoteRef:
        key: cdcp-prod
        property: HCAPTCHA_SECRET_KEY
      secretKey: HCAPTCHA_SECRET_KEY
    - remoteRef:
        key: cdcp-prod
        property: INTEROP_API_SUBSCRIPTION_KEY
      secretKey: INTEROP_API_SUBSCRIPTION_KEY
    - remoteRef:
        key: cdcp-prod
        property: OTEL_API_KEY
      secretKey: OTEL_API_KEY
    - remoteRef:
        key: cdcp-prod
        property: SESSION_COOKIE_SECRET
      secretKey: SESSION_COOKIE_SECRET
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-backend
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: oauth-proxy
  name: oauth-proxy
spec:
  data:
    - remoteRef:
        key: cdcp-prod
        property: OAUTH2_PROXY_CLIENT_SECRET
      secretKey: OAUTH2_PROXY_CLIENT_SECRET
    - remoteRef:
        key: cdcp-prod
        property: OAUTH2_PROXY_COOKIE_SECRET
      secretKey: OAUTH2_PROXY_COOKIE_SECRET
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-backend
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: redis
  name: redis
spec:
  data:
    - remoteRef:
        key: cdcp-prod
        property: REDIS_PASSWORD
      secretKey: REDIS_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-backend
